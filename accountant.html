<style>
    :root {
        --ink: #1B3A2F; --paper: #F4F2EA; --paper-line: #E3DFD0;
        --amber: #B5762A; --amber-bg: #FBEFDD; --text: #2A2A24; --text-soft: #6B6B5F;
        --danger: #B23A2E; --danger-bg: #F6E2DE;
    }
    * { box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--paper); color: var(--text); margin: 0; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    h1, h2, h3 { margin: 0; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 32px 64px; }
    .wrap-narrow { max-width: 660px; }
    .header { background: var(--ink); color: var(--paper); padding: 20px 32px; }
    .header .wrap { padding: 0; }
    .header .brand { font-size: 13px; letter-spacing: 1px; color: #C9DACF; }
    .header h1 { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .header .sub { font-size: 12.5px; color: #B8CBBE; margin-top: 2px; }
    .back-link { background: none; border: none; color: #C9DACF; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; padding: 0; margin-bottom: 10px; font-family: inherit; }
    .signout-link { background: none; border: none; color: #C9DACF; cursor: pointer; font-size: 12.5px; font-family: inherit; }
    .tabs { background: #fff; border-bottom: 1px solid var(--paper-line); }
    .tabs .wrap { display: flex; gap: 4px; padding: 0 32px; }
    .tab-btn { display: flex; align-items: center; gap: 6px; padding: 13px 6px; margin: 0 12px 0 0; background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-soft); font-weight: 500; font-size: 13.5px; font-family: inherit; }
    .tab-btn.active { border-bottom-color: var(--ink); color: var(--ink); font-weight: 600; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 5px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-soft); padding: 4px; }

    .section-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--ink); }

    // ------------------------------------------------------------------------
    // EC calendar helpers (Fliegel & Van Flandern JDN on the Gregorian side,
    // calibrated against Meskerem 1, 2017 EC = Sep 11 2024 GC)
    // ------------------------------------------------------------------------
    const EC_OFFSET = 1724220;
    const EC_MONTHS = ['Meskerem', 'Tikimt', 'Hidar', 'Tahsas', 'Tir', 'Yekatit', 'Megabit', 'Miyazia', 'Ginbot', 'Sene', 'Hamle', 'Nehase', 'Pagume'];

    function gregorianToJdn(y, m, d) {
        const a = Math.floor((14 - m) / 12);
        const yy = y + 4800 - a;
        const mm = m + 12 * a - 3;
        return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    }
    function jdnToGregorian(jdn) {
        const a = jdn + 32044;
        const b = Math.floor((4 * a + 3) / 146097);
        const c = a - Math.floor((146097 * b) / 4);
        const d = Math.floor((4 * c + 3) / 1461);
        const e = c - Math.floor((1461 * d) / 4);
        const m = Math.floor((5 * e + 2) / 153);
        const day = e - Math.floor((153 * m + 2) / 5) + 1;
        const month = m + 3 - 12 * Math.floor(m / 10);
        const year = 100 * b + d - 4800 + Math.floor(m / 10);
        return { year, month, day };
    }
    function ethiopianToJdn(y, m, d) { return d + (m - 1) * 30 + (y - 1) * 365 + Math.floor(y / 4) + EC_OFFSET; }
    function ecToGc(y, m, d) {
        const { year, month, day } = jdnToGregorian(ethiopianToJdn(y, m, d));
        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }
    function daysInEcMonth(y, m) {
        if (m !== 13) return 30;
        return ethiopianToJdn(y + 1, 1, 1) - ethiopianToJdn(y, 13, 1); // Pagume is 5 or 6 days
    }
    function lastGcDateOfEcPeriod(periodKey) {
        const [y, m] = periodKey.split('-').map(Number);
        // Month 12 in a period key is the merged Nehase+Pagume period, so its
        // last day is the last day of Pagume, not day 30 of Nehase.
        if (m === 12) return ecToGc(y, 13, daysInEcMonth(y, 13));
        return ecToGc(y, m, 30);
    }
    function gcToEc(isoDate) {
        if (!isoDate) return null;
        const [gy, gm, gd] = isoDate.split('-').map(Number);
        const jdn = gregorianToJdn(gy, gm, gd);
        const approx = gy - 8;
        for (let ey = approx - 1; ey <= approx + 2; ey++) {
            const start = ethiopianToJdn(ey, 1, 1);
            const end = ethiopianToJdn(ey + 1, 1, 1);
            if (jdn >= start && jdn < end) {
                const rem = jdn - start;
                const month = Math.floor(rem / 30) + 1;
                const day = (rem % 30) + 1;
                return { year: ey, month, day };
            }
        }
        return null;
    }
    function ecPeriodKey(ec) {
        if (!ec) return '';

        const allRows = [];
        periods.forEach((periodKey) => {

                { d: rule.vatBefore.desc, a: rule.vatBefore.acct, amt: vatBefore },
                { d: rule.vatAmount.desc, a: rule.vatAmount.acct, amt: vatAmount },

        XLSX.utils.book_append_sheet(wb, ws, 'GL Rules');
        return wb;
    }
    // Returns an ARRAY of matches (not just one) because a real chart of
    // accounts often uses ONE combined account for both "VAT recoverable"
    // (payments side) and "VAT payable" (receipts side) — e.g. "Vat
    // Payable/Rece". That single row needs to fill both rule slots, or one
    // of them stays blank and Peachtree rejects the exported CSV.
    function keywordMatches(label) {
        const s = (label || '').toLowerCase();
        const has = (...words) => words.every((w) => s.includes(w));
        const out = [];
        if (has('vat') && (has('rec') || has('recoverable'))) out.push(['payments', 'vatAmount']);
        if (has('vat') && has('pay')) out.push(['receipts', 'vatPay']);
        if (out.length) return out;
        if (has('withhold')) return [['receipts', 'vatWithholding']];
        if (has('non', 'vat') && has('sale')) return [['receipts', 'nonVatSales']];
        if (has('non', 'vat')) return [['payments', 'nonVat']];
        if (has('sale')) return [['receipts', 'sales']];
        if (has('purchase')) return [['payments', 'vatBefore']];
        return [];
    }
    function parseRulesFile(workbook) {
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        if (!rows.length) return { matched: [], unmatched: [] };
        // Peachtree's own "Account List" export has a business name, report
        // title, and date printed above the real header row — so find the
        // row that actually says "Account ID" / "Description" rather than
        // assuming it's the very first row.
        let headerRowIdx = rows.findIndex((r) => (r || []).some((c) => /account/i.test(String(c || ''))) && (r || []).some((c) => /desc/i.test(String(c || ''))));
        if (headerRowIdx < 0) headerRowIdx = 0;
        const headerRow = (rows[headerRowIdx] || []).map((h) => String(h || '').toLowerCase());
        const idx = (needle) => headerRow.findIndex((h) => h.includes(needle));
        const descIdx = idx('desc') >= 0 ? idx('desc') : 2;
        const lineIdx = idx('line') >= 0 ? idx('line') : idx('journal') >= 0 ? idx('journal') : descIdx;
        const acctIdx = idx('account') >= 0 ? idx('account') : idx('code') >= 0 ? idx('code') : idx('id') >= 0 ? idx('id') : 3;
        const matched = [];
        const unmatched = [];
        rows.slice(headerRowIdx + 1).forEach((row) => {
            if (!row || !row.length) return;
            const label = row[lineIdx];
            const desc = row[descIdx];
            const acct = row[acctIdx];
            if (!desc && !acct) return;
            const ms = keywordMatches(String(label || desc || ''));
            if (ms.length) ms.forEach((m) => matched.push({ group: m[0], key: m[1], desc: String(desc ?? ''), acct: String(acct ?? '') }));
            else unmatched.push({ label, desc, acct });
        });
        return { matched, unmatched };
    }

    function mapClientFromDb(row) {

    function clientPatchToDb(patch) {
        const map = { name: 'name', tin: 'tin', vatRegNo: 'vat_reg_no', tradeType: 'trade_type', cashAccount: 'cash_account', pvCounter: 'pv_counter', paymentsRule: 'payments_rule', receiptsRule: 'receipts_rule', linkedBusinessId: 'linked_business_id' };
        const out = {};
        Object.keys(patch).forEach((k) => { if (map[k]) out[map[k]] = patch[k]; });
        return out;
    }
    function mapEntryFromDb(row) {
        return {
            id: row.id, type: row.type, date: row.date, sellerName: row.seller_name || '', sellerTin: row.seller_tin || '',
            vatRegNo: row.vat_reg_no || '', mrc: row.mrc || '', receiptNo: row.receipt_no || '', isVat: row.is_vat,
            beforeVat: row.before_vat, vat: row.vat, total: row.total, description: row.description || '',
            measurement: row.measurement || '', quantity: row.quantity, unitPrice: row.unit_price, missing: row.missing || [],
            reviewed: row.reviewed !== false, tinMismatch: !!row.tin_mismatch,
        };
    }
    function entryToDb(entry, clientId) {
        return {
            client_id: clientId, type: entry.type, date: entry.date,
            seller_name: entry.sellerName || null, seller_tin: entry.sellerTin || null, vat_reg_no: entry.vatRegNo || null,
            mrc: entry.mrc || null, receipt_no: entry.receiptNo || null, is_vat: !!entry.isVat,
            before_vat: Number(entry.beforeVat) || 0, vat: Number(entry.vat) || 0, total: Number(entry.total) || 0,
            description: entry.description || null, measurement: entry.measurement || null,
            quantity: entry.quantity === '' || entry.quantity == null ? null : Number(entry.quantity),
            unit_price: entry.unitPrice === '' || entry.unitPrice == null ? null : Number(entry.unitPrice),
            missing: entry.missing || [],
            reviewed: entry.reviewed !== false,
            tin_mismatch: !!entry.tinMismatch,
        };
    }
    // Loose TIN comparison: strips everything but digits so "0123456789",
    // "012-345-6789" and "012 345 6789" are all treated as the same TIN.
    function normalizeTin(t) { return (t || '').replace(/\D/g, ''); }
    // A scanned document prints two TINs: whoever issued it (seller_tin) and
    // whoever received it (buyer_tin). Our client is normally one of those
    // two — if the printed Seller TIN is our client's own TIN, this was a
    // sale the client made; if the Buyer TIN is our client's, this was a
    // purchase the client made. If NEITHER matches, the document probably
    // isn't this client's at all (grabbed by mistake), so it gets flagged.
    function evaluateTinMatch(ex, client) {
        const clientTin = normalizeTin(client && client.tin);
        const sellerTin = normalizeTin(ex.seller_tin);
        const buyerTin = normalizeTin(ex.buyer_tin);
        if (!clientTin) return { type: null, mismatch: false }; // no TIN on file for this client to check against
        const sellerIsClient = !!sellerTin && sellerTin === clientTin;
        const buyerIsClient = !!buyerTin && buyerTin === clientTin;
        if (sellerIsClient && !buyerIsClient) return { type: 'receipt', mismatch: false }; // client issued it -> a Sale
        if (buyerIsClient && !sellerIsClient) return { type: 'payment', mismatch: false }; // client received it -> a Purchase
        if (!sellerIsClient && !buyerIsClient && (sellerTin || buyerTin)) return { type: null, mismatch: true }; // neither side is the client
        return { type: null, mismatch: false }; // not enough info printed to tell either way
    }

        setAuthLoading(true);
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        setAuthLoading(false);
        if (error) return showAuthError(error.message);
        // Saved here rather than as part of the signUp() call itself, since

    // Creates the accountant_profiles row from the name/phone collected at
    // signup, the first time a session becomes available for this browser
    // (right away if no email confirmation is required, or on the first
    // sign-in after confirming). Does nothing once the pending value has
    // been consumed, or if the person never signed up on this device.
    async function applyPendingAccountantProfile() {
        if (!currentUserId) return;
        let pending = null;
        try { pending = JSON.parse(sessionStorage.getItem('meleya_acct_pending_profile') || 'null'); } catch (e) {}
        if (!pending) return;
        try { sessionStorage.removeItem('meleya_acct_pending_profile'); } catch (e) {}
        await supabaseClient.from('accountant_profiles').upsert({ user_id: currentUserId, full_name: pending.full_name, phone: pending.phone });
    }
    // Live-updates the requests inbox and any link status the instant it
    // changes on either side (client approves/declines/revokes, etc.) —
    // no refresh needed.
    let accountantLinksChannel = null;
    function subscribeToAccountantLinks() {
        if (!currentUserId) return;
        if (accountantLinksChannel) supabaseClient.removeChannel(accountantLinksChannel);
        accountantLinksChannel = supabaseClient
            .channel(`accountant_links_acct_${currentUserId}`)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'accountant_links', filter: `accountant_user_id=eq.${currentUserId}` }, async (payload) => {
                await refreshMyLinks();
                notifyMyLinkChange(payload);
                render();

            .subscribe();
    }
    // Mirrors notifyAccountantLinkChange() in index.html -- fires for every
    // insert/update on this accountant's links, including ones this same
    // tab just made (realtime echoes your own writes back), so "every
    // action shows up in notifications" is one handler instead of a call at
    // every button. requested_by reliably tells us who sent the original
    // request (and by the RLS rules only the other side can approve/
    // decline it), so direction is accurate for insert/approve/decline;
    // revoke can come from either side once approved, so that one stays
    // neutral rather than guessing who did it.
    function notifyMyLinkChange(payload) {
        const row = payload.new || payload.old;
        if (!row) return;
        const link = myLinks.find((l) => l.id === row.id);
        const name = link ? link.business_name : 'A business';
        if (payload.eventType === 'INSERT') {
            if (row.requested_by === 'client') {
                addNotif('Link request received', `${name} requested to link their inventory to you.`);
                showIncomingLinkToast(row.id, name);
            } else {
                addNotif('Link request sent', `You sent a link request to ${name}.`);
            }
        } else if (payload.eventType === 'UPDATE') {
            if (row.status === 'approved') {
                addNotif('Link approved', row.requested_by === 'client' ? `You approved ${name}'s request.` : `${name} approved your request.`);
            } else if (row.status === 'declined') {
                addNotif('Link declined', row.requested_by === 'client' ? `You declined ${name}'s request.` : `${name} declined your request.`);
            } else if (row.status === 'revoked') {
                addNotif('Access revoked', `Access with ${name} was revoked.`);
                showInfoLinkToast(`Access with <strong>${esc(name)}</strong> was revoked.`);
            } else if (row.status === 'cancelled') {
                addNotif('Link request cancelled', row.requested_by === 'client' ? `${name} cancelled their request to you.` : `You cancelled your request to ${name}.`);
            }
        }
    }

    // ---- Admin "Login as Accountant" impersonation handoff ----
    // Mirrors tryConsumeAdminImpersonationHandoff() in index.html: admin.html
    // stashes a single-use magic-link token in localStorage right before
    // opening this page in a new tab; we consume it here (and immediately
    // delete it from localStorage) so it can never be replayed.
    async function tryConsumeAdminAccountantImpersonationHandoff() {
        let raw;
        try { raw = localStorage.getItem('neba_admin_impersonation_handoff_accountant'); } catch (e) { return false; }
        if (!raw) return false;
        try { localStorage.removeItem('neba_admin_impersonation_handoff_accountant'); } catch (e) {}

        let handoff;
        try { handoff = JSON.parse(raw); } catch (e) { return false; }
        if (!handoff || !handoff.hashedToken) return false;
        if (!handoff.issuedAt || (Date.now() - handoff.issuedAt) > 60000) return false;

        const { error } = await supabaseClient.auth.verifyOtp({ token_hash: handoff.hashedToken, type: 'magiclink' });
        if (error) {
            alert('This admin-initiated session link is no longer valid: ' + error.message);
            return false;
        }

        sessionStorage.setItem('neba_admin_impersonation_active_accountant', '1');
        sessionStorage.setItem('neba_admin_impersonation_accountant_name', handoff.fullName || '');
        return true;
    }

    async function endAdminAccountantImpersonationSession() {

    // Left/right arrow keys step through receipts while the detail popup is
    // open — but only when focus isn't in a text field, so editing a field's
    // text (which also uses left/right to move the cursor) still works normally.
    // Ctrl+Z / Cmd+Z undoes the most recent action anywhere in the app, same
    // caveat about not hijacking a text field's own native undo.
    document.addEventListener('keydown', (evt) => {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        const inTextField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
        if ((evt.ctrlKey || evt.metaKey) && !evt.shiftKey && evt.key.toLowerCase() === 'z' && !inTextField) {
            evt.preventDefault();
            performUndo();
            return;

    function addSearchHistoryTerm(scope, term) {
        term = (term || '').trim();

        hist = hist.slice(0, 8);

    }
    function removeSearchHistoryTerm(scope, term) {
        const hist = getSearchHistory(scope).filter((t) => t !== term);

    // ------------------------------------------------------------------------
    // Receipt reading: Google's Gemini API (free tier via Google AI Studio —
    // no billing account, ~1,000 requests/day free on Flash-Lite). Unlike
    // plain OCR, this is a real model that understands the receipt's layout
    // (ignores the buyer's TIN, knows "TAX1" means VAT, etc.) instead of
    // pattern-matching blindly. Anything it can't confidently find is left
    // blank and flagged for the accountant to fill in on the review screen.
    // ------------------------------------------------------------------------
    function loadImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Could not read image'));
            img.src = URL.createObjectURL(file);
        });
    }
    function canvasToJpegBlob(canvas, quality) {
        return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
    }
    // Shrink large phone photos before upload — faster, and keeps well within
    // Gemini's inline-image size limits.
    async function compressImageForAi(file) {
        const img = await loadImage(file);
        let maxDim = 1600, quality = 0.8;
        let blob = null;
        for (let attempt = 0; attempt < 5; attempt++) {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            blob = await canvasToJpegBlob(canvas, quality);
            if (blob.size <= 900 * 1024) break;
            maxDim = Math.round(maxDim * 0.8);
            quality = Math.max(0.5, quality - 0.1);
        }
        URL.revokeObjectURL(img.src);
        return blob;
    }
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result.split(',')[1]);
            r.onerror = () => reject(new Error('Could not read image'));
            r.readAsDataURL(blob);
        });
    }
    // The prompt, model fallback list, and the actual OpenRouter call now all
    // live server-side in /api/extract-receipt.js — the API key never reaches
    // the browser. This function just sends the compressed image to our own
    // endpoint and returns whatever it hands back.
    async function runGeminiExtraction(file, onStatus) {
        onStatus && onStatus('Preparing photo…');
        const blob = await compressImageForAi(file);
        const base64 = await blobToBase64(blob);
        // blobToBase64 returns a data: URL — strip the prefix, the server expects raw base64.
        const base64Data = base64.includes(',') ? base64.split(',')[1] : base64;

        onStatus && onStatus('Reading the receipt…');
        const res = await fetch('/api/extract-receipt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64Data }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
            throw new Error((data && data.error) || `Receipt extraction failed (${res.status})`);
        }
        return data;
    }

    // ------------------------------------------------------------------------
    // Undo — a short-lived stack of recent destructive/overwriting actions
    // (deleting a receipt, editing a receipt, saving GL rules). Each entry
    // knows how to reverse itself. Ctrl+Z / Cmd+Z undoes the most recent
    // action anywhere in the app; the Undo buttons on specific pages undo
    // the most recent action of that page's kind.
    // ------------------------------------------------------------------------
    let undoStack = [];
    let undoIdSeq = 0;
    function pushUndo(scope, label, run) {
        undoStack.push({ id: ++undoIdSeq, scope, label, run });
        if (undoStack.length > 15) undoStack.shift(); // don't grow forever
    }
    function lastUndoFor(scope) {
        for (let i = undoStack.length - 1; i >= 0; i--) {
            if (undoStack[i].scope === scope) return undoStack[i];
        }
        return null;
    }
    async function performUndo(scope) {
        // With no scope, undo whichever action happened most recently overall
        // (this is what the Ctrl+Z shortcut uses). With a scope, undo the
        // most recent action of that kind (this is what page Undo buttons use).
        const action = scope ? lastUndoFor(scope) : undoStack[undoStack.length - 1];
        if (!action) return;
        undoStack = undoStack.filter((a) => a.id !== action.id);
        try {
            await action.run();
        } catch (e) {
            alert('Could not undo that: ' + (e.message || e));
        }
        render();
    }
    function renderUndoBar(scope) {
        const action = lastUndoFor(scope);
        if (!action) return '';
        return `
            <div class="notice notice-muted undo-bar">
                <span>${icon('undo-2', 14)} ${esc(action.label)}</span>

            </div>`;
    }


    async function loadClients() {
        const { data, error } = await supabaseClient.from('accountant_clients').select('*').order('created_at');
        if (error) { console.error(error); clients = []; return; }
        clients = (data || []).map(mapClientFromDb);
    }
    async function loadEntriesForActiveClient() {
        const client = activeClient();
        if (!client) return;
        const { data, error } = await supabaseClient.from('accountant_entries').select('*').eq('client_id', client.id).order('date', { ascending: false });
        if (error) { console.error(error); client.entries = []; return; }
        client.entries = (data || []).map(mapEntryFromDb);
    }

    // ---- Add-client flow: search MELEYA first, fall back to manual add ----
    let addClientSearchOpen = false;
    let addClientQuery = '';
    let addClientResults = [];
    let addClientBusy = false;
    function openAddClientSearch() { addClientSearchOpen = true; addClientQuery = ''; addClientResults = []; render(); }
    function closeAddClientSearch() { addClientSearchOpen = false; render(); }
    async function addClientManually() {
        const { data, error } = await supabaseClient.from('accountant_clients').insert({ name: 'New client' }).select().single();
        if (error) { alert(error.message); return; }
        clients.push(mapClientFromDb(data));
        addClientSearchOpen = false;
        openClient(data.id);
    }
    // Live preview as the person types (doesn't touch history) -- separate
    // from submitAddClientSearch() below, which is the only thing that
    // records a search term: pressing Enter, clicking Search, or clicking a
    // result. This way partial, still-being-typed text never pollutes the
    // recent-searches list.
    async function runAddClientSearch(q) {
        addClientQuery = q;
        if (q.trim().length < 2) { addClientResults = []; render(); return; }
        addClientBusy = true; render();
        const { data, error } = await supabaseClient.rpc('search_businesses', { query: q.trim() });
        addClientBusy = false;
        addClientResults = error ? [] : (data || []);
        render();
    }
    // The explicit "entered" path: Enter key, the Search button, or clicking
    // a recent-search pill.
    function submitAddClientSearch(term) {
        const q = (term !== undefined ? term : addClientQuery).trim();
        if (q.length < 2) return;
        addSearchHistoryTerm('add_client', q);
        runAddClientSearch(q);
    }
    // Sends a fresh link request for this accountant+business pair. If one
    // already exists: a declined/revoked/cancelled link is revived back to
    // pending (so re-requesting after any of those actually works), while a
    // pending or approved link is left untouched (nothing to do).
    async function upsertLinkRequest(businessId) {
        const { data: existing, error: selErr } = await supabaseClient
            .from('accountant_links').select('id, status')
            .eq('accountant_user_id', currentUserId).eq('business_id', businessId).maybeSingle();
        if (selErr) return { error: selErr };
        if (!existing) {
            return await supabaseClient.from('accountant_links').insert({ accountant_user_id: currentUserId, business_id: businessId, requested_by: 'accountant' });
        }
        if (existing.status === 'declined' || existing.status === 'revoked' || existing.status === 'cancelled') {
            return await supabaseClient.from('accountant_links').update({ status: 'pending', requested_by: 'accountant', responded_at: null }).eq('id', existing.id);
        }
        return { error: null }; // already pending or approved -- nothing to change
    }
    async function addClientFromSearch(businessId) {
        const r = addClientResults.find((x) => x.business_id === businessId);
        if (!r) return;
        const existing = clients.find((c) => c.linkedBusinessId === businessId);
        if (existing) {
            addClientSearchOpen = false;
            openClient(existing.id);
            return;
        }
        const { data, error } = await supabaseClient.from('accountant_clients').insert({
            name: r.business_name,
            tin: r.vat_tin || '', vat_reg_no: r.vat_reg_no || '', trade_type: r.business_type || '',
        }).select().single();
        if (error) { alert(error.message); return; }
        const client = mapClientFromDb(data);
        clients.push(client);
        // linked_business_id is only set once the link request itself
        // succeeds -- otherwise the client would show as "linked" with no
        // accountant_links row behind it, and the Inventory tab would have
        // nothing to look up.
        const { error: linkError } = await upsertLinkRequest(businessId);
        if (linkError) {
            alert(`Client added, but the link request failed: ${linkError.message}. You can retry from their Inventory tab.`);
        } else {
            await patchClient(client.id, { linkedBusinessId: businessId });
        }
        await refreshMyLinks();
        addClientSearchOpen = false;
        openClient(client.id);
    }
    function renderAddClientSearch() {
        const results = addClientResults.map((r) => {
            const existing = clients.find((c) => c.linkedBusinessId === r.business_id);
            const action = existing
                ? `<button class="btn btn-ghost" style="padding:6px 12px; font-size:12.5px;" onclick="addClientFromSearch('${r.business_id}')">${icon('arrow-right', 14)} Open existing client</button>`
                : `<button class="btn btn-primary" style="padding:6px 12px; font-size:12.5px;" onclick="addClientFromSearch('${r.business_id}')">${icon('plus', 14)} Add this client</button>`;
            return `
            <div class="list-row" style="cursor:pointer;" onclick="addSearchHistoryTerm('add_client','${escForJsString(r.business_name)}')">
                <div><div class="name">${esc(r.business_name)}</div><div class="meta">${esc(r.phone) || ''}${r.business_type ? ` · ${esc(r.business_type)}` : ''}${r.owner_full_name ? ` · ${esc(r.owner_full_name)}` : ''}</div></div>
                ${action}
            </div>`;
        }).join('');
        return `
            <div class="header"><div class="wrap">
                <button class="back-link" onclick="closeAddClientSearch()">${icon('arrow-left', 14)} All clients</button>
                <h1>Add a client</h1>
                <div class="sub">Search for them on MELEYA first — this links their inventory automatically once they approve</div>
            </div></div>

                <div style="display:flex; gap:8px; margin-bottom:14px;">
                    <input id="add-client-search-input" placeholder="Search by business name, phone, or owner's name…" value="${esc(addClientQuery)}" oninput="runAddClientSearch(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); submitAddClientSearch();}" style="flex:1;" autofocus>
                    <button class="btn btn-primary" style="padding:0 16px;" onclick="submitAddClientSearch()">${icon('search', 15)} Search</button>
                </div>
                ${!addClientQuery.trim() ? renderSearchHistoryInline('add_client', 'submitAddClientSearch') : ''}
                ${addClientBusy ? `<div style="color:var(--text-soft); font-size:13px; margin-bottom:10px;">Searching…</div>` : ''}
                ${!addClientBusy && addClientQuery.trim().length >= 2 && addClientResults.length === 0 ? `<div style="color:var(--text-soft); font-size:13px; margin-bottom:10px;">No matching business found on MELEYA.</div>` : ''}
                ${addClientResults.length ? `<div class="list" style="margin-bottom:20px;">${results}</div>` : ''}
                <div style="border-top:1px solid var(--paper-line); padding-top:16px;">
                    <div style="font-size:12.5px; color:var(--text-soft); margin-bottom:10px;">Not on MELEYA? You can still add them and log their receipts by hand.</div>
                    <button class="btn btn-ghost" onclick="addClientManually()">${icon('user-plus', 15)} Add manually instead</button>
                </div>
            </div>`;
    }
    async function deleteClient(id) {
        const client = clients.find((c) => c.id === id);
        if (!client) return;
        if (!confirm(`Remove ${client.name}? This deletes all their logged receipts.`)) return;
        const { error } = await supabaseClient.from('accountant_clients').delete().eq('id', id);
        if (error) { alert(error.message); return; }
        clients = clients.filter((c) => c.id !== id);
        // Deleting a client linked to a MELEYA business also revokes that
        // link -- otherwise the business would still show as "approved"
        // with an accountant who, on this side, no longer has any record
        // of them. The business picks this up the normal way: their
        // realtime subscription logs it to their notifications and shows
        // the same toast used for incoming requests.
        if (client.linkedBusinessId) {
            const link = myLinks.find((l) => l.business_id === client.linkedBusinessId && (l.status === 'approved' || l.status === 'pending'));
            if (link) {
                await supabaseClient.from('accountant_links').update({ status: 'revoked', responded_at: new Date().toISOString() }).eq('id', link.id);
                await refreshMyLinks();
            }
        }
        render();
    }
    async function patchClient(id, patch) {
        const client = clients.find((c) => c.id === id);
        if (!client) return;
        Object.assign(client, patch);
        const { error } = await supabaseClient.from('accountant_clients').update(clientPatchToDb(patch)).eq('id', id);
        if (error) alert(error.message);
    }

    async function openClient(id) {
        activeClientId = id;
        activeTab = 'receipts';
        receiptsFilter = { mode: 'all', month: null, year: currentEcYear() };

        render();
        await loadEntriesForActiveClient();
        render();

    async function addEntry(entry) {
        const client = activeClient();
        const { data, error } = await supabaseClient.from('accountant_entries').insert(entryToDb(entry, client.id)).select().single();
        if (error) { alert(error.message); return; }
        client.entries.unshift(mapEntryFromDb(data));
        client.entryCount = (client.entryCount || 0) + 1;
        rememberSeller(entry.sellerName, entry.sellerTin);
        processNextQueuedFile(); // moves to the next photo in the batch, or closes the flow if none left
    }
    async function removeEntry(id) {
        const client = activeClient();
        if (!client) return;
        const idx = client.entries.findIndex((e) => e.id === id);
        const snapshot = idx !== -1 ? { ...client.entries[idx] } : null;
        const { error } = await supabaseClient.from('accountant_entries').delete().eq('id', id);
        if (error) { alert(error.message); return; }
        client.entries = client.entries.filter((e) => e.id !== id);
        client.entryCount = Math.max(0, (client.entryCount || 1) - 1);
        if (snapshot) {
            const clientId = client.id;
            pushUndo('receipt', `Deleted receipt${snapshot.sellerName ? ' — ' + snapshot.sellerName : ''}`, async () => {
                const c = clients.find((cl) => cl.id === clientId);
                if (!c) return;
                const { data, error: insErr } = await supabaseClient.from('accountant_entries').insert(entryToDb(snapshot, clientId)).select().single();
                if (insErr) { alert(insErr.message); return; }
                c.entries.unshift(mapEntryFromDb(data));
                c.entryCount = (c.entryCount || 0) + 1;
            });
        }
        render();
    }

    // ------------------------------------------------------------------------

    // ------------------------------------------------------------------------
    function render() {
        // Re-rendering rebuilds the whole page's HTML, which would normally
        // steal focus out of whatever input the person is typing in (e.g. a
        // search box that re-renders on every keystroke). Remember which
        // field was focused, and where the cursor was, then restore both
        // afterward.
        const active = document.activeElement;
        const activeId = active && active.id ? active.id : null;
        const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
        const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

        const root = document.getElementById('view-root');
        let html = addClientSearchOpen ? renderAddClientSearch() : (linksInboxOpen ? renderLinksInbox() : (activeClientId ? renderClientDetail() : renderDashboard()));
        if (profileModalOpen) html += renderProfileModal();
        if (linkSearchOpen) html += renderLinkSearchModal();
        html += renderIncomingLinkToast();
        root.innerHTML = html;
        refreshIcons();

        if (activeId) {
            const el = document.getElementById(activeId);
            if (el) {
                el.focus();
                if (selStart !== null && el.setSelectionRange) {
                    try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text-selectable input, ignore */ }
                }
            }
        }
    }

    // ------------------------------------------------------------------------
    // EC period filter (shared by Receipts + Export tabs): All / By Month / By Year
    // ------------------------------------------------------------------------
    function filterRange(state, entries) {
        if (state.mode === 'all') {
            const periods = ecPeriodsFor(entries);
            if (!periods.length) { const y = currentEcYear(); return [`${y}-01`, `${y}-13`]; }
            return [periods[0], periods[periods.length - 1]];
        }
        // Ethiopian fiscal year is named after its END year: fiscal year 2018
        // runs Hamle 2017 (month 11) through Sene 2018 (month 10).
        if (state.mode === 'year') return [`${state.year - 1}-11`, `${state.year}-10`];
        return [`${state.year}-${String(state.month).padStart(2, '0')}`, `${state.year}-${String(state.month).padStart(2, '0')}`];
    }
    function renderEcFilter(prefix, entries, state) {
        const years = ecYearsFor(entries || []);
        // Only 12 selectable months — Pagume is merged into Nehase, so it's
        // never its own filter option.
        const monthOptions = Array.from({ length: 12 }, (_, i) => i + 1)
            .map((m) => `<option value="${m}" ${state.month === m ? 'selected' : ''}>${periodMonthLabel(m)}</option>`).join('');
        const yearOptions = years.map((y) => `<option value="${y}" ${state.year === y ? 'selected' : ''}>${y}</option>`).join('');
        return `
            <div class="filter-bar">
                <select onchange="${prefix}SetMode(this.value)">
                    <option value="all" ${state.mode === 'all' ? 'selected' : ''}>All periods</option>
                    <option value="month" ${state.mode === 'month' ? 'selected' : ''}>By Month</option>
                    <option value="year" ${state.mode === 'year' ? 'selected' : ''}>By Year</option>
                </select>
                ${state.mode === 'month' ? `<select onchange="${prefix}SetMonth(this.value)"><option value="" disabled ${!state.month ? 'selected' : ''}>Month</option>${monthOptions}</select>` : ''}
                ${state.mode !== 'all' ? `<select onchange="${prefix}SetYear(this.value)">${yearOptions}</select>` : ''}
            </div>`;
    }
    function rfSetMode(v) { receiptsFilter.mode = v; if (v === 'month' && !receiptsFilter.month) receiptsFilter.month = 1; render(); }
    function rfSetMonth(v) { receiptsFilter.month = Number(v); receiptsFilter.mode = 'month'; render(); }
    function rfSetYear(v) { receiptsFilter.year = Number(v); render(); }
    function efSetMode(v) { exportFilter.mode = v; if (v === 'month' && !exportFilter.month) exportFilter.month = 1; render(); }
    function efSetMonth(v) { exportFilter.month = Number(v); exportFilter.mode = 'month'; render(); }
    function efSetYear(v) { exportFilter.year = Number(v); render(); }

    // ------------------------------------------------------------------------
    // Receipts tab
    // ------------------------------------------------------------------------
    function renderReceiptsTab(client) {
        const [fromKey, toKey] = filterRange(receiptsFilter, client.entries);
        const filtered = receiptsFilter.mode === 'all' ? client.entries : client.entries.filter((e) => { const k = entryEcKey(e); return k >= fromKey && k <= toKey; });
        const sorted = [...filtered].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        receiptsListOrder = sorted.map((e) => e.id);

        const rows = sorted.map((e) => `
            <tr class="entry-row${e.reviewed === false ? ' unreviewed' : ''}${e.tinMismatch ? ' tin-mismatch' : ''}" onclick="openEntryDetail('${e.id}')" style="cursor:pointer;">
                <td class="mono" style="font-size:12px;">${esc(e.date) || '—'}</td>
                <td>${esc(e.sellerName) || 'Unknown seller'}${e.missing && e.missing.length ? ` <span title="Needs review: ${esc(e.missing.join(', '))}" style="color:var(--amber);">${icon('alert-triangle', 12)}</span>` : ''}${e.reviewed === false ? `<span class="badge-new" title="Auto-saved from a batch upload — not reviewed yet">New</span>` : ''}${e.tinMismatch ? `<span class="tin-mismatch-badge" title="Neither party's TIN on the document matches this client — excluded from exports">${icon('alert-triangle', 11)} TIN mismatch</span>` : ''}</td>
                <td style="font-size:12px; color:var(--text-soft);">${e.type === 'payment' ? 'Purchase' : 'Sale'}</td>
                <td class="mono num">${money(e.beforeVat)}</td>
                <td class="mono num">${money(e.vat)}</td>
                <td class="mono num" style="font-weight:600;">${money(e.total)}</td>
                <td style="text-align:right; white-space:nowrap;">
                    ${e.tinMismatch ? `<button class="btn-icon" title="Unflag — include in exports" onclick="event.stopPropagation(); toggleTinMismatch('${e.id}')">${icon('flag', 14)}</button>` : ''}
                    <button class="btn-icon" onclick="event.stopPropagation(); removeEntry('${e.id}')">${icon('trash-2', 14)}</button>
                </td>
            </tr>`).join('');

        return `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
                <div style="font-size:14px; color:var(--text-soft);">${client.entries.length} receipt${client.entries.length === 1 ? '' : 's'} logged</div>
                ${addFlow ? '' : `<button class="btn btn-primary" onclick="startAddReceipt()">${icon('plus', 16)} Add receipt</button>`}
            </div>
            ${renderUndoBar('receipt')}
            <div style="margin-bottom:16px;">${renderEcFilter('rf', client.entries, receiptsFilter)}</div>
            ${addFlow ? renderAddReceiptFlow() : ''}
            ${sorted.length === 0
                ? `<div class="empty">${icon('receipt', 28)}<div>No receipts in this view yet.</div></div>`
                : `<div class="list" style="overflow-x:auto;"><table class="entries">
                    <thead><tr><th>Date</th><th>Seller</th><th>Type</th><th class="num">Before VAT</th><th class="num">VAT</th><th class="num">Total</th><th></th></tr></thead>
                    <tbody>${rows}</tbody></table></div>`}
            ${entryModalId ? renderEntryDetailModal() : ''}`;
    }

    // ------------------------------------------------------------------------
    // Receipt detail / edit modal
    // ------------------------------------------------------------------------
    let entryModalId = null;
    let entryModalDraft = null;
    // The order of receipt ids currently shown in the list, kept up to date
    // by renderReceiptsTab. Lets the popup step to the next/previous receipt
    // in the same order the person sees on screen (respecting filters).
    let receiptsListOrder = [];
    function openEntryDetail(id) {
        const client = activeClient();
        const e = client && client.entries.find((x) => x.id === id);
        if (!e) return;
        entryModalId = id;
        entryModalDraft = JSON.parse(JSON.stringify(e));
        render();
    }
    function closeEntryDetail() { entryModalId = null; entryModalDraft = null; render(); }
    // Moving away from an unreviewed (auto-saved) receipt — either by saving
    // it or by stepping to the next/previous one — counts as having looked
    // at it, so its "New" highlighting goes away from here on.
    async function markEntryReviewed(id) {
        const client = activeClient();
        if (!client) return;
        const idx = client.entries.findIndex((x) => x.id === id);
        if (idx === -1) return;
        if (client.entries[idx].reviewed !== false) return; // already reviewed, nothing to do
        const { error } = await supabaseClient.from('accountant_entries').update({ reviewed: true }).eq('id', id);
        if (error) { console.error(error); return; }
        client.entries[idx] = { ...client.entries[idx], reviewed: true };
    }
    // Lets the accountant flip a receipt's TIN-mismatch flag off (it was a
    // false alarm — the receipt does belong to this client, so include it in
    // exports again) or back on if they change their mind.
    async function toggleTinMismatch(id) {
        const client = activeClient();
        if (!client) return;
        const idx = client.entries.findIndex((x) => x.id === id);
        if (idx === -1) return;
        const next = !client.entries[idx].tinMismatch;
        const { error } = await supabaseClient.from('accountant_entries').update({ tin_mismatch: next }).eq('id', id);
        if (error) { alert(error.message); return; }
        client.entries[idx] = { ...client.entries[idx], tinMismatch: next };
        render();
    }
    async function goToAdjacentEntry(delta) {
        if (!entryModalId) return;
        const idx = receiptsListOrder.indexOf(entryModalId);
        if (idx === -1) return;
        const newIdx = idx + delta;
        if (newIdx < 0 || newIdx >= receiptsListOrder.length) return; // already at the first/last receipt
        await markEntryReviewed(entryModalId);
        openEntryDetail(receiptsListOrder[newIdx]);
    }
    function prevEntry() { goToAdjacentEntry(-1); }
    function nextEntry() { goToAdjacentEntry(1); }
    function onEntryDateInput(v) {
        entryModalDraft.date = v;
        const ec = gcToEc(v);
        const el = document.getElementById('edit-ec-label');
        if (el) el.textContent = ec ? `${EC_MONTHS[ec.month - 1]} ${ec.day}, ${ec.year} (EC)` : '';
    }
    async function saveEntryEdit() {
        const client = activeClient();
        const d = entryModalDraft;
        const idx = client.entries.findIndex((x) => x.id === entryModalId);
        const previous = idx >= 0 ? { ...client.entries[idx] } : null;
        const patch = {
            type: d.type, date: d.date, sellerName: d.sellerName, sellerTin: d.sellerTin, vatRegNo: d.vatRegNo,
            mrc: d.mrc, receiptNo: d.receiptNo, isVat: !!d.isVat,
            beforeVat: Number(d.beforeVat) || 0, vat: Number(d.vat) || 0, total: Number(d.total) || 0,
            description: d.description, measurement: d.measurement,
            quantity: d.quantity === '' ? null : Number(d.quantity), unitPrice: d.unitPrice === '' ? null : Number(d.unitPrice),
            reviewed: true, tinMismatch: !!d.tinMismatch,
        };
        const { error } = await supabaseClient.from('accountant_entries').update(entryToDb(patch, client.id)).eq('id', entryModalId);
        if (error) { alert(error.message); return; }
        if (idx >= 0) client.entries[idx] = { ...client.entries[idx], ...patch };
        rememberSeller(patch.sellerName, patch.sellerTin);
        if (previous) {
            const clientId = client.id;
            const entryId = entryModalId;
            pushUndo('receipt', `Edited receipt${previous.sellerName ? ' — ' + previous.sellerName : ''}`, async () => {
                const c = clients.find((cl) => cl.id === clientId);
                if (!c) return;
                const { error: revErr } = await supabaseClient.from('accountant_entries').update(entryToDb(previous, clientId)).eq('id', entryId);
                if (revErr) { alert(revErr.message); return; }
                const i = c.entries.findIndex((x) => x.id === entryId);
                if (i >= 0) c.entries[i] = { ...c.entries[i], ...previous };
            });
        }
        closeEntryDetail();
    }
    async function deleteEntryFromModal() {
        const id = entryModalId;
        closeEntryDetail();
        await removeEntry(id);
    }
    function renderEntryDetailModal() {
        const d = entryModalDraft;
        const ec = gcToEc(d.date);
        const ecLabel = ec ? `${EC_MONTHS[ec.month - 1]} ${ec.day}, ${ec.year} (EC)` : '';
        const field = (key, label, mono) => `
            <div><label>${label}</label>
            <input value="${esc(d[key])}" style="${mono ? "font-family:'IBM Plex Mono',monospace;" : ''}" oninput="entryModalDraft.${key}=this.value"></div>`;
        const navIdx = receiptsListOrder.indexOf(entryModalId);
        const hasPrev = navIdx > 0;
        const hasNext = navIdx !== -1 && navIdx < receiptsListOrder.length - 1;
        return `
            <div style="position:fixed; inset:0; z-index:400; background:rgba(27,58,47,0.45); display:flex; align-items:center; justify-content:center; padding:20px;" onclick="if(event.target===this) closeEntryDetail();">
                <div class="card" style="max-width:600px; width:100%; margin:0; max-height:90vh; overflow-y:auto;">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:8px;">
                        <div class="section-title" style="margin:0;">Receipt details${navIdx !== -1 ? ` <span style="font-weight:400; color:var(--text-soft); font-size:12px;">(${navIdx + 1} of ${receiptsListOrder.length})</span>` : ''}</div>
                        <div style="display:flex; align-items:center; gap:4px;">
                            <button class="btn-icon" onclick="prevEntry()" ${hasPrev ? '' : 'disabled'} title="Previous receipt (←)">${icon('chevron-left', 18)}</button>
                            <button class="btn-icon" onclick="nextEntry()" ${hasNext ? '' : 'disabled'} title="Next receipt (→)">${icon('chevron-right', 18)}</button>
                            <button class="btn-icon" onclick="closeEntryDetail()">${icon('x', 18)}</button>
                        </div>
                    </div>
                    ${d.reviewed === false ? `<div class="notice notice-warn">${icon('alert-triangle', 14)} Auto-saved from a batch upload, not reviewed yet. Check the fields below, then Save (or just move to the next one — that marks it reviewed too).</div>` : ''}
                    ${d.tinMismatch ? `<div class="notice notice-danger">${icon('alert-triangle', 14)} <div>Neither party's TIN on this document matched this client's TIN, so it's excluded from filing exports. <button type="button" class="btn btn-ghost" style="margin-left:6px; padding:2px 8px; font-size:12px;" onclick="entryModalDraft.tinMismatch=false; render();">${icon('check', 12)} Confirm it's theirs — include it</button></div></div>` : ''}
                    ${renderUndoBar('receipt')}
                    <div style="display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;">
                        <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;"><input type="radio" name="edit-entry-type" style="width:auto;" ${d.type === 'payment' ? 'checked' : ''} onchange="entryModalDraft.type='payment'"> Purchase (payment out)</label>
                        <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;"><input type="radio" name="edit-entry-type" style="width:auto;" ${d.type === 'receipt' ? 'checked' : ''} onchange="entryModalDraft.type='receipt'"> Sale (receipt in)</label>
                        <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; margin-left:auto;"><input type="checkbox" style="width:auto;" ${d.isVat ? 'checked' : ''} onchange="entryModalDraft.isVat=this.checked"> VAT receipt</label>
                    </div>
                    <div class="grid-2" style="margin-bottom:12px;">
                        <div><label>Date (GC)</label><input type="date" value="${esc(d.date)}" oninput="onEntryDateInput(this.value)"></div>
                        <div><label>&nbsp;</label><div id="edit-ec-label" class="mono" style="font-size:12px; color:var(--text-soft); padding-top:8px;">${esc(ecLabel)}</div></div>
                    </div>
                    <div class="grid-3" style="margin-bottom:12px;">
                        ${field('sellerName', 'Seller name')}
                        ${field('sellerTin', 'Seller TIN', true)}
                        ${field('vatRegNo', 'VAT reg no', true)}
                        ${field('mrc', 'MRC code', true)}
                        ${field('receiptNo', 'Receipt / FS number')}
                        <div></div>
                    </div>
                    <div class="grid-3" style="margin-bottom:12px;">
                        ${field('beforeVat', 'Before VAT', true)}
                        ${field('vat', 'VAT', true)}
                        ${field('total', 'Total', true)}
                    </div>
                    <div class="grid-4" style="margin-bottom:16px;">
                        ${field('description', 'Description')}
                        ${field('measurement', 'Measurement')}
                        ${field('quantity', 'Quantity', true)}
                        ${field('unitPrice', 'Unit price', true)}
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-primary" onclick="saveEntryEdit()">${icon('check', 15)} Save changes</button>
                        <button class="btn btn-ghost" onclick="deleteEntryFromModal()">${icon('trash-2', 15)} Delete receipt</button>
                        <button class="btn btn-ghost" onclick="closeEntryDetail()">Cancel</button>
                    </div>
                </div>
            </div>`;
    }

    // ------------------------------------------------------------------------
    // Add receipt flow (upload -> extracting -> review/save)
    // ------------------------------------------------------------------------
    function startAddReceipt() {
        addFlow = { step: 'upload', preview: null, error: null, form: null, statusText: '', queue: [], queueTotal: 0, queueIndex: 0 };
        render();
    }
    function cancelAddReceipt() { addFlow = null; render(); }

    // Accepts one or many files (multi-select, or repeated camera captures).
    // The first is processed immediately; the rest wait in addFlow.queue and
    // are reviewed one at a time after each save/skip.
    async function handleReceiptFile(input) {
        const files = Array.from(input.files || []);
        input.value = ''; // lets the same file(s) be picked again later
        if (!files.length) return;
        addFlow.queue = files.slice(1);
        addFlow.queueTotal = files.length;
        addFlow.queueIndex = 1;
        await processReceiptFile(files[0]);
    }
    function processNextQueuedFile() {
        if (addFlow && addFlow.queue && addFlow.queue.length) {
            addFlow.queueIndex += 1;
            const next = addFlow.queue.shift();
            processReceiptFile(next);
        } else {
            addFlow = null;
            render();
        }
    }
    function skipQueuedFile() { processNextQueuedFile(); }

    async function processReceiptFile(file) {
        addFlow.error = null;
        addFlow.preview = URL.createObjectURL(file);
        addFlow.step = 'extracting';
        addFlow.statusText = 'Preparing photo…';
        render();
        try {
            const ex = await runGeminiExtraction(file, (status) => {
                addFlow.statusText = status;
                const el = document.getElementById('ocr-progress-text');
                if (el) el.textContent = status;
            });
            // If the photo only shows one of seller name / seller TIN clearly,
            // check past receipts for that same seller and fill in the other.
            ex.missing_fields = ex.missing_fields || [];
            if (ex.seller_tin && !ex.seller_name) {
                const remembered = recallSellerNameByTin(ex.seller_tin);
                if (remembered) {
                    ex.seller_name = remembered;
                    ex.missing_fields = ex.missing_fields.filter((f) => f !== 'Seller name');
                }
            } else if (ex.seller_name && !ex.seller_tin) {
                const remembered = recallSellerTinByName(ex.seller_name);
                if (remembered) {
                    ex.seller_tin = remembered;
                    ex.missing_fields = ex.missing_fields.filter((f) => f !== 'Seller TIN');
                }
            }
            const calendar = ex.date_calendar === 'EC' ? 'EC' : 'GC';
            let gcDate = '';
            if (ex.date_year && ex.date_month && ex.date_day) {
                gcDate = calendar === 'EC' ? ecToGc(ex.date_year, ex.date_month, ex.date_day) : `${ex.date_year}-${String(ex.date_month).padStart(2, '0')}-${String(ex.date_day).padStart(2, '0')}`;
            }
            // Sanity-check which side of the transaction this client is on
            // (see evaluateTinMatch). A mismatch usually means the document
            // was picked up by mistake (it's actually someone else's) — flag
            // the whole row rather than a single field, and keep it out of
            // filings until the accountant confirms it and unflags it. We
            // don't keep the scanned TINs around afterward, just the flag
            // and (when we could tell) the Purchase/Sale type.
            const client = activeClient();
            const match = evaluateTinMatch(ex, client);
            const entryType = match.type || 'payment';
            addFlow.tinMismatchInfo = match.mismatch ? { seller: ex.seller_tin, buyer: ex.buyer_tin, expected: client.tin } : null;
            addFlow.form = {
                type: entryType, calendar, ecYear: ex.date_year || '', ecMonth: ex.date_month || '', ecDay: ex.date_day || '', date: gcDate,
                sellerName: ex.seller_name || '', sellerTin: ex.seller_tin || '', vatRegNo: ex.vat_reg_no || '', mrc: ex.mrc || '',
                receiptNo: ex.receipt_no || '', isVat: !!ex.is_vat, beforeVat: ex.before_vat ?? '', vat: ex.vat ?? '', total: ex.total ?? '',
                description: ex.description || '', measurement: ex.measurement || '', quantity: ex.quantity ?? '', unitPrice: ex.unit_price ?? '',
                missing: ex.missing_fields || [], tinMismatch: match.mismatch,
            };
            addFlow.step = 'review';
        } catch (e) {
            console.error(e);
            addFlow.error = 'Could not read this receipt automatically. Fill the fields in by hand below.';
            addFlow.tinMismatchInfo = null;
            addFlow.form = { type: 'payment', calendar: 'GC', ecYear: '', ecMonth: '', ecDay: '', date: '', sellerName: '', sellerTin: '', vatRegNo: '', mrc: '', receiptNo: '', isVat: true, beforeVat: '', vat: '', total: '', description: '', measurement: '', quantity: '', unitPrice: '', missing: [], tinMismatch: false };
            addFlow.step = 'review';
        }
        render();

        // Multiple photos uploaded at once: don't make the person click "Save"
        // for every single one. Auto-save it as soon as we have a usable date,
        // flagged "unreviewed" so it's easy to find and double check later.
        // If extraction failed or there's no date to save with, pause here and
        // let the person fix this one by hand before the batch continues.
        const isBatch = addFlow.queueTotal > 1;
        if (isBatch && !addFlow.error && addFlow.form.date) {
            await saveReceiptForm(false);
        }
    }

                        <button class="btn btn-primary" onclick="document.getElementById('receipt-file-input').click()">${icon('upload', 15)} Choose photos</button>
                        <button class="btn btn-ghost" onclick="document.getElementById('receipt-camera-input').click()">${icon('camera', 15)} Take photo</button>
                        <button class="btn btn-ghost" onclick="cancelAddReceipt()">Cancel</button>
                    </div>
                    <div style="margin-top:10px; font-size:11.5px; color:var(--text-soft);">Select several photos at once and they'll scan and save automatically, flagged for a quick review afterward on the Receipts page.</div>
                </div>`;
        }
        const progress = addFlow.queueTotal > 1 ? `<div style="font-size:11.5px; color:var(--text-soft); margin-bottom:8px;">Photo ${addFlow.queueIndex} of ${addFlow.queueTotal}</div>` : '';
        if (addFlow.step === 'extracting') {
            return `
                <div class="card">
                    ${progress}
                    <div style="display:flex; gap:16px; align-items:center;">
                        ${addFlow.preview ? `<img src="${addFlow.preview}" style="width:90px; height:90px; object-fit:cover; border-radius:4px; border:1px solid var(--paper-line);">` : ''}
                        <div style="display:flex; align-items:center; gap:8px; color:var(--text-soft); font-size:13.5px;"><span class="spin" style="display:inline-flex;">${icon('loader-2', 16)}</span> <span id="ocr-progress-text">${esc(addFlow.statusText || 'Reading the receipt…')}</span></div>
                    </div>
                </div>`;
        }
        const f = addFlow.form;

        const field = (key, label, flagName, mono) => `
            <div><label>${label}</label>
            <input type="text" id="f-${key}" value="${esc(f[key])}" class="${missingSet.has(flagName || label) ? 'flagged' : ''}" style="${mono ? "font-family:'IBM Plex Mono',monospace;" : ''}" oninput="addFlow.form.${key}=this.value"></div>`;
        const dateStatus = f.date ? `→ ${f.date} (GC)` : 'date incomplete';
        return `
            <div class="card">
                ${progress}
                <div class="receipt-review-row" style="display:flex; gap:18px;">
                    ${addFlow.preview ? `<img src="${addFlow.preview}" class="receipt-preview-img" style="width:130px; border-radius:4px; border:1px solid var(--paper-line); align-self:flex-start;">` : ''}
                    <div style="flex:1; min-width:0;">
                        ${addFlow.error ? `<div class="notice notice-warn">${icon('alert-triangle', 14)} ${esc(addFlow.error)}</div>` : ''}
                        <div style="display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;">
                            <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;"><input type="radio" name="entry-type" style="width:auto;" ${f.type === 'payment' ? 'checked' : ''} onchange="addFlow.form.type='payment'"> Purchase (payment out)</label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;"><input type="radio" name="entry-type" style="width:auto;" ${f.type === 'receipt' ? 'checked' : ''} onchange="addFlow.form.type='receipt'"> Sale (receipt in)</label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; margin-left:auto;"><input type="checkbox" style="width:auto;" ${f.isVat ? 'checked' : ''} onchange="addFlow.form.isVat=this.checked"> VAT receipt</label>
                        </div>
                        ${f.tinMismatch ? `
                        <div class="notice notice-danger">
                            ${icon('alert-triangle', 14)}
                            <div>
                                <div><strong>Neither party's TIN matches this client.</strong> Seller TIN ${esc(addFlow.tinMismatchInfo ? (addFlow.tinMismatchInfo.seller || '—') : '')}, Buyer TIN ${esc(addFlow.tinMismatchInfo ? (addFlow.tinMismatchInfo.buyer || '—') : '')} — this client's TIN is ${esc(addFlow.tinMismatchInfo ? addFlow.tinMismatchInfo.expected : '')}.</div>
                                <div style="margin-top:4px; font-size:12px;">It will still be saved, but kept out of filing exports until you confirm it belongs to this client.</div>
                                <button type="button" class="btn btn-ghost" style="margin-top:6px; padding:4px 10px; font-size:12px;" onclick="addFlow.form.tinMismatch=false; render();">${icon('check', 13)} This is correct — include it</button>
                            </div>
                        </div>` : ''}
                        <div class="grid-3" style="margin-bottom:12px;">
                            ${field('sellerName', 'Seller name')}
                            ${field('sellerTin', 'Seller TIN', 'Seller TIN')}
                            ${field('vatRegNo', 'VAT reg no', 'VAT reg no')}
                            ${field('mrc', 'MRC code', 'MRC')}
                            ${field('receiptNo', 'Receipt / FS number')}
                            <div></div>
                        </div>
                        <div style="border:1px solid var(--paper-line); border-radius:5px; padding:12px; margin-bottom:12px; background:var(--paper);">
                            <div style="display:flex; gap:16px; margin-bottom:10px;">
                                <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;"><input type="radio" name="cal" style="width:auto;" ${f.calendar === 'EC' ? 'checked' : ''} onchange="setDateCalendar('EC')"> Ethiopian calendar date</label>
                                <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;"><input type="radio" name="cal" style="width:auto;" ${f.calendar === 'GC' ? 'checked' : ''} onchange="setDateCalendar('GC')"> Gregorian calendar date</label>
                            </div>
                            <div class="date-part-grid" style="display:grid; grid-template-columns:repeat(3,90px) 1fr; gap:10px; align-items:end;">

                                    ${f.calendar === 'EC' && f.ecMonth ? `${EC_MONTHS[Number(f.ecMonth) - 1] || '?'} ${f.ecYear}` : ''}
                                    <div id="date-preview" class="mono" style="font-weight:600; color:${f.date ? 'var(--text)' : 'var(--amber)'};">${dateStatus}</div>

                            </div>
                        </div>
                        <div class="grid-3" style="margin-bottom:12px;">

                        <div class="grid-4" style="margin-bottom:16px;">
                            ${field('description', 'Description')}
                            ${field('measurement', 'Measurement', 'Measurement')}
                            ${field('quantity', 'Quantity', 'Quantity', true)}
