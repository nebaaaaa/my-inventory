<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELEYA — Accountant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
<style>
    :root {
        --ink: #1B3A2F; --paper: #F4F2EA; --paper-line: #E3DFD0;
        --amber: #B5762A; --amber-bg: #FBEFDD; --text: #2A2A24; --text-soft: #6B6B5F;
        --danger: #B23A2E; --danger-bg: #F6E2DE;
    }
    * { box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--paper); color: var(--text); margin: 0; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    h1, h2, h3 { margin: 0; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 32px 64px; }
    .wrap-narrow { max-width: 660px; }
    .header { background: var(--ink); color: var(--paper); padding: 20px 32px; }
    .header .wrap { padding: 0; }
    .header .brand { font-size: 13px; letter-spacing: 1px; color: #C9DACF; }
    .header h1 { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .header .sub { font-size: 12.5px; color: #B8CBBE; margin-top: 2px; }
    .back-link { background: none; border: none; color: #C9DACF; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; padding: 0; margin-bottom: 10px; font-family: inherit; }
    .signout-link { background: none; border: none; color: #C9DACF; cursor: pointer; font-size: 12.5px; font-family: inherit; }
    .tabs { background: #fff; border-bottom: 1px solid var(--paper-line); }
    .tabs .wrap { display: flex; gap: 4px; padding: 0 32px; }
    .tab-btn { display: flex; align-items: center; gap: 6px; padding: 13px 6px; margin: 0 12px 0 0; background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-soft); font-weight: 500; font-size: 13.5px; font-family: inherit; }
    .tab-btn.active { border-bottom-color: var(--ink); color: var(--ink); font-weight: 600; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 5px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-soft); padding: 4px; }
    .card { border: 1px solid var(--paper-line); border-radius: 6px; background: #fff; padding: 22px; margin-bottom: 20px; }
    .empty { border: 1px dashed var(--paper-line); border-radius: 6px; padding: 48px 24px; text-align: center; color: var(--text-soft); }
    .empty svg { opacity: 0.5; margin-bottom: 10px; }
    .list { border: 1px solid var(--paper-line); border-radius: 6px; overflow: hidden; background: #fff; }
    .list-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; border-top: 1px solid var(--paper-line); border-left: 3px solid var(--ink); }
    .list-row:first-child { border-top: none; }
    .list-row .name { font-weight: 600; font-size: 15px; }
    .list-row .meta { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
    label { font-size: 11px; color: var(--text-soft); display: block; margin-bottom: 3px; }
    input, select { width: 100%; padding: 7px 9px; font-size: 13px; border-radius: 4px; border: 1px solid var(--paper-line); font-family: inherit; box-sizing: border-box; background: #fff; }
    input.flagged { border-color: var(--amber); background: var(--amber-bg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .section-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--ink); }
    .section { margin-bottom: 22px; }
    .notice { display: flex; gap: 6px; align-items: flex-start; padding: 8px 10px; border-radius: 4px; font-size: 12.5px; margin-bottom: 12px; }
    .notice-ok { background: #EAF3EC; color: var(--ink); }
    .notice-warn { background: var(--amber-bg); color: var(--amber); }
    .notice-muted { background: var(--paper-line); color: var(--text-soft); }
    .rule-row { display: grid; grid-template-columns: 220px 1fr 100px; gap: 10px; align-items: center; margin-bottom: 8px; }
    .rule-row .label { font-size: 13px; color: var(--text-soft); }
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-bar select { width: auto; }
    table.entries { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.entries th { text-align: left; font-size: 11.5px; color: var(--text-soft); background: var(--paper); font-weight: 600; padding: 10px 16px; }
    table.entries td { padding: 12px 16px; border-top: 1px solid var(--paper-line); vertical-align: middle; }
    table.entries td.num { text-align: right; }
    .export-row { border: 1px solid var(--paper-line); border-radius: 6px; background: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .export-row .icon-box { width: 34px; height: 34px; border-radius: 5px; background: var(--paper); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .export-row .title { font-size: 13.5px; font-weight: 600; }
    .export-row .desc { font-size: 12px; color: var(--text-soft); margin-top: 1px; }
    .export-row .info { flex: 1; }
    .form-group { margin-bottom: 14px; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .centered { min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    /* Auth screen — same layout/feel as index.html's welcome screen */
    #auth-overlay { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 40px 16px; overflow-y: auto; background: var(--paper); }
    .auth-brand-mark-fixed { position: fixed; top: 22px; left: 24px; font-size: 18px; font-weight: 700; letter-spacing: 1px; z-index: 2; }
    .auth-brand-mark-fixed .accent { color: var(--amber); }
    .auth-brand-mark-fixed .dark { color: var(--ink); }
    .auth-bg-chart { position: absolute; top: 50%; left: 0; width: 100%; height: 420px; transform: translateY(-50%); z-index: 0; pointer-events: none; }
    .auth-welcome-heading { font-size: 28px; font-weight: 700; color: var(--ink); margin: 0 0 4px; text-align: center; }
    .auth-welcome-subtitle { font-size: 13.5px; color: var(--text-soft); text-align: center; margin: 0 0 22px; }
    .auth-footer-note { position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; font-size: 12px; color: var(--text-soft); z-index: 1; }
    .auth-box { max-width: 400px; width: 100%; position: relative; z-index: 2; }
    .pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; display: flex; }
</style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-brand-mark-fixed"><span class="accent">M</span><span class="dark">ELEYA</span></div>
    <svg class="auth-bg-chart" viewBox="0 0 1200 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,340 90,336 180,260 270,150 360,120 450,135 540,110 630,190 720,165 810,230 900,270 990,310 1080,330 1200,345" fill="none" stroke="#B5762A" stroke-width="4" opacity="0.25"/>
        <polyline points="0,345 90,344 180,320 270,290 360,282 450,288 540,282 630,296 720,306 810,320 900,336 990,346 1080,352 1200,358" fill="none" stroke="#1B3A2F" stroke-width="4" opacity="0.25"/>
    </svg>

    <div class="card auth-box">
        <h1 class="auth-welcome-heading">Welcome</h1>
        <p class="auth-welcome-subtitle">Sign in to your bookkeeping workspace.</p>
        <div id="auth-error" class="notice notice-warn" style="display:none;"></div>

        <div id="auth-signin-view">
            <div class="form-group"><label>Email</label><input type="email" id="signin-email"></div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" id="signin-password" style="padding-right:38px;">
                    <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('signin-password', this)"><svg viewBox="0 0 576 512" width="17" height="17"><path fill="#6B6B5F" d="M572.5 238.1C518.3 108.8 411.2 32 288 32S57.7 108.8 3.5 238.1a48.2 48.2 0 0 0 0 35.8C57.7 403.2 164.8 480 288 480s230.3-76.8 284.5-206.1a48.2 48.2 0 0 0 0-35.8zM288 400a144 144 0 1 1 0-288 144 144 0 0 1 0 288z"/><circle cx="288" cy="256" r="80" fill="#6B6B5F"/></svg></button>
                </div>
            </div>
            <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleSignIn()">Sign In</button>
            <p style="text-align:center; font-size:13px; margin-top:12px;"><a href="#" onclick="handleForgotPassword(); return false;" style="color:var(--text-soft);">Forgot password?</a></p>
            <p style="text-align:center; font-size:13px; margin-top:4px; color:var(--text-soft);">Don't have an account yet? <a href="#" onclick="showAuthView('signup'); return false;" style="color:var(--amber); font-weight:600;">Create one</a></p>
        </div>

        <div id="auth-signup-view" style="display:none;">
            <div class="form-group"><label>Your full name</label><input type="text" id="auth-full-name" placeholder="e.g. Mekdes Alemu"></div>
            <div class="form-group"><label>Phone number</label><input type="tel" id="auth-phone" placeholder="e.g. 0911 234 567"></div>
            <div class="form-group"><label>Email</label><input type="email" id="auth-email"></div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" id="auth-password" style="padding-right:38px;" placeholder="At least 6 characters">
                    <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('auth-password', this)"><svg viewBox="0 0 576 512" width="17" height="17"><path fill="#6B6B5F" d="M572.5 238.1C518.3 108.8 411.2 32 288 32S57.7 108.8 3.5 238.1a48.2 48.2 0 0 0 0 35.8C57.7 403.2 164.8 480 288 480s230.3-76.8 284.5-206.1a48.2 48.2 0 0 0 0-35.8zM288 400a144 144 0 1 1 0-288 144 144 0 0 1 0 288z"/><circle cx="288" cy="256" r="80" fill="#6B6B5F"/></svg></button>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div style="position:relative;">
                    <input type="password" id="auth-password-confirm" style="padding-right:38px;">
                    <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('auth-password-confirm', this)"><svg viewBox="0 0 576 512" width="17" height="17"><path fill="#6B6B5F" d="M572.5 238.1C518.3 108.8 411.2 32 288 32S57.7 108.8 3.5 238.1a48.2 48.2 0 0 0 0 35.8C57.7 403.2 164.8 480 288 480s230.3-76.8 284.5-206.1a48.2 48.2 0 0 0 0-35.8zM288 400a144 144 0 1 1 0-288 144 144 0 0 1 0 288z"/><circle cx="288" cy="256" r="80" fill="#6B6B5F"/></svg></button>
                </div>
            </div>
            <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleSignUp()">Create Account</button>
            <p style="text-align:center; font-size:13px; margin-top:16px; color:var(--text-soft);">Already have an account? <a href="#" onclick="showAuthView('signin'); return false;" style="color:var(--amber); font-weight:600;">Sign in</a></p>
        </div>

        <div id="auth-loading" style="display:none; text-align:center; margin-top:14px; font-size:12px; color:var(--text-soft);">Working, please wait…</div>
    </div>
    <div class="auth-footer-note">&copy; 2026 MELEYA. All rights reserved.</div>
</div>

<div id="app" style="display:none;">
    <div id="view-root"></div>
</div>

<script>
    // ------------------------------------------------------------------------
    // Config — same Supabase project as the rest of the Meleya platform
    // ------------------------------------------------------------------------
    const SUPABASE_URL = "https://nwkrrcatdhppvlceuzwg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53a3JyY2F0ZGhwcHZsY2V1endnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjEzNjUsImV4cCI6MjA5OTg5NzM2NX0.kELqbONKGQIs2Z99Zx8rEcwuYekTCugLYtbsYW3_0h8";
    // Free Gemini API key — get one at https://aistudio.google.com/apikey
    // (Google account, no card). Replace this placeholder before using the
    // receipt-scan feature. Free tier (Flash-Lite): ~1,000 requests/day.
    const GEMINI_API_KEY = "AQ.Ab8RN6JuTgPqc96t1AuRSXkShnIY2kY5Z_jKzzT8G_phpjeI6A";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function refreshIcons() { if (window.lucide) lucide.createIcons(); }
    function icon(name, size) { return `<i data-lucide="${name}" style="width:${size||15}px;height:${size||15}px;"></i>`; }

    // ------------------------------------------------------------------------
    // EC calendar helpers (Fliegel & Van Flandern JDN on the Gregorian side,
    // calibrated against Meskerem 1, 2017 EC = Sep 11 2024 GC)
    // ------------------------------------------------------------------------
    const EC_OFFSET = 1724220;
    const EC_MONTHS = ['Meskerem', 'Tikimt', 'Hidar', 'Tahsas', 'Tir', 'Yekatit', 'Megabit', 'Miyazia', 'Ginbot', 'Sene', 'Hamle', 'Nehase', 'Pagume'];

    function gregorianToJdn(y, m, d) {
        const a = Math.floor((14 - m) / 12);
        const yy = y + 4800 - a;
        const mm = m + 12 * a - 3;
        return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    }
    function jdnToGregorian(jdn) {
        const a = jdn + 32044;
        const b = Math.floor((4 * a + 3) / 146097);
        const c = a - Math.floor((146097 * b) / 4);
        const d = Math.floor((4 * c + 3) / 1461);
        const e = c - Math.floor((1461 * d) / 4);
        const m = Math.floor((5 * e + 2) / 153);
        const day = e - Math.floor((153 * m + 2) / 5) + 1;
        const month = m + 3 - 12 * Math.floor(m / 10);
        const year = 100 * b + d - 4800 + Math.floor(m / 10);
        return { year, month, day };
    }
    function ethiopianToJdn(y, m, d) { return d + (m - 1) * 30 + (y - 1) * 365 + Math.floor(y / 4) + EC_OFFSET; }
    function ecToGc(y, m, d) {
        const { year, month, day } = jdnToGregorian(ethiopianToJdn(y, m, d));
        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }
    function daysInEcMonth(y, m) {
        if (m !== 13) return 30;
        return ethiopianToJdn(y + 1, 1, 1) - ethiopianToJdn(y, 13, 1); // Pagume is 5 or 6 days
    }
    function lastGcDateOfEcPeriod(periodKey) {
        const [y, m] = periodKey.split('-').map(Number);
        // Month 12 in a period key is the merged Nehase+Pagume period, so its
        // last day is the last day of Pagume, not day 30 of Nehase.
        if (m === 12) return ecToGc(y, 13, daysInEcMonth(y, 13));
        return ecToGc(y, m, 30);
    }
    function gcToEc(isoDate) {
        if (!isoDate) return null;
        const [gy, gm, gd] = isoDate.split('-').map(Number);
        const jdn = gregorianToJdn(gy, gm, gd);
        const approx = gy - 8;
        for (let ey = approx - 1; ey <= approx + 2; ey++) {
            const start = ethiopianToJdn(ey, 1, 1);
            const end = ethiopianToJdn(ey + 1, 1, 1);
            if (jdn >= start && jdn < end) {
                const rem = jdn - start;
                const month = Math.floor(rem / 30) + 1;
                const day = (rem % 30) + 1;
                return { year: ey, month, day };
            }
        }
        return null;
    }
    function ecPeriodKey(ec) {
        if (!ec) return '';
        // Pagume (the short 13th month) is merged into Nehase for reporting —
        // both share one grouping key, one journal total, one check number.
        const m = ec.month === 13 ? 12 : ec.month;
        return `${ec.year}-${String(m).padStart(2, '0')}`;
    }
    function periodMonthLabel(m) { return m === 12 ? 'Nehase-Pagume' : EC_MONTHS[m - 1]; }
    function ecPeriodLabel(key) {
        if (!key) return 'Undated';
        const [y, m] = key.split('-').map(Number);
        return `${periodMonthLabel(m)} ${y}`;
    }
    function entryEcKey(e) { return ecPeriodKey(gcToEc(e.date)); }
    function ecPeriodsFor(entries) {
        const keys = Array.from(new Set(entries.map(entryEcKey).filter(Boolean)));
        return keys.sort();
    }
    function currentEcYear() {
        const today = new Date();
        const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const ec = gcToEc(iso);
        return ec ? ec.year : 2017;
    }
    function ecYearsFor(entries) {
        const periods = ecPeriodsFor(entries);
        const years = periods.map((p) => Number(p.split('-')[0]));
        const cur = currentEcYear();
        const min = years.length ? Math.min(...years, cur) : cur - 1;
        const max = years.length ? Math.max(...years, cur) : cur + 1;
        const out = [];
        for (let y = min - 1; y <= max + 1; y++) out.push(y);
        return out;
    }
    function money(n) { return (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    // ------------------------------------------------------------------------
    // GL rule defaults
    // ------------------------------------------------------------------------
    const RULE_SLOTS = {
        payments: [['nonVat', 'Non-VAT purchases'], ['vatBefore', 'VAT purchases, before VAT'], ['vatAmount', 'VAT recoverable']],
        receipts: [['sales', 'VAT sales, before VAT'], ['nonVatSales', 'Non-VAT sales'], ['vatPay', 'VAT payable'], ['vatWithholding', 'VAT withholding']],
    };

    // ------------------------------------------------------------------------
    // File download / CSV helpers
    // ------------------------------------------------------------------------
    function downloadBlob(content, filename, mime) {
        const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    function csvEscape(v) {
        const s = String(v ?? '');
        if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
        return s;
    }
    function toCsv(rows) { return rows.map((r) => r.map(csvEscape).join(',')).join('\r\n'); }

    // ------------------------------------------------------------------------
    // CSV / XLSX builders — unchanged logic from the original tool
    // ------------------------------------------------------------------------
    // Both journal builders now walk each EC month inside the picked range
    // separately, instead of adding every receipt in the range into one
    // combined total. Each month gets its own set of G/L lines.
    function buildPaymentsCsv(client, fromKey, toKey) {
        const entries = client.entries.filter((e) => e.type === 'payment' && entryEcKey(e) >= fromKey && entryEcKey(e) <= toKey);
        if (!entries.length) return null;
        const periods = Array.from(new Set(entries.map(entryEcKey))).sort();
        const rule = client.paymentsRule;
        let counter = client.pvCounter;
        const allRows = [];
        periods.forEach((periodKey) => {
            const periodEntries = entries.filter((e) => entryEcKey(e) === periodKey);
            let nonVat = 0, vatBefore = 0, vatAmount = 0;
            periodEntries.forEach((e) => {
                if (e.isVat) { vatBefore += Number(e.beforeVat) || 0; vatAmount += Number(e.vat) || 0; }
                else { nonVat += Number(e.total ?? e.beforeVat) || 0; }
            });
            const lines = [
                { d: rule.nonVat.desc, a: rule.nonVat.acct, amt: nonVat },
                { d: rule.vatBefore.desc, a: rule.vatBefore.acct, amt: vatBefore },
                { d: rule.vatAmount.desc, a: rule.vatAmount.acct, amt: vatAmount },
            ].filter((l) => Math.abs(l.amt) > 0.001);
            if (!lines.length) return;
            const checkNo = `PV ${String(counter).padStart(4, '0')}`;
            // Use the last calendar day of the EC month/period, not the date
            // of the last individual receipt, e.g. Meskerem 2017 -> 10/10/24.
            const repDate = lastGcDateOfEcPeriod(periodKey);
            const [y, m, d] = repDate.split('-');
            const date = `${m}/${d}/${y.slice(2)}`;
            lines.forEach((l) => allRows.push(['Cashier', checkNo, date, client.cashAccount, 'Yes', String(lines.length), '', l.d, l.a, l.amt.toFixed(2)]));
            counter += 1; // one check number per EC month, not per download
        });
        if (!allRows.length) return null;
        const header = ['Vendor Name', 'Check Number', 'Date', 'Cash Account', 'Detailed Payment', 'Number of Distributions', 'Invoice Paid', 'Description', 'G/L Account', 'Amount'];
        return { csv: toCsv([header, ...allRows]), nextCounter: counter };
    }
    function buildReceiptsCsv(client, fromKey, toKey) {
        const entries = client.entries.filter((e) => e.type === 'receipt' && entryEcKey(e) >= fromKey && entryEcKey(e) <= toKey);
        if (!entries.length) return null;
        const periods = Array.from(new Set(entries.map(entryEcKey))).sort();
        const rule = client.receiptsRule;
        const allRows = [];
        periods.forEach((periodKey) => {
            const periodEntries = entries.filter((e) => entryEcKey(e) === periodKey);
            let sales = 0, nonVatSales = 0, vatPay = 0, vatWithholding = 0;
            periodEntries.forEach((e) => {
                if (e.isVat) { sales += Number(e.beforeVat) || 0; vatPay += Number(e.vat) || 0; }
                else { nonVatSales += Number(e.total ?? e.beforeVat) || 0; }
            });
            const ref = periodMonthLabel(Number(periodKey.split('-')[1])); // e.g. "Meskerem" or "Nehase-Pagume"
            const repDate = periodEntries.map((e) => e.date).sort().slice(-1)[0];
            const [y, m, d] = repDate.split('-');
            const date = `${m}/${d}/${y.slice(2)}`;
            const lines = [
                { d: rule.sales.desc, a: rule.sales.acct, amt: -sales },
                { d: rule.nonVatSales.desc, a: rule.nonVatSales.acct, amt: -nonVatSales },
                { d: rule.vatPay.desc, a: rule.vatPay.acct, amt: -vatPay },
                { d: rule.vatWithholding.desc, a: rule.vatWithholding.acct, amt: vatWithholding },
            ].filter((l) => Math.abs(l.amt) > 0.001);
            if (!lines.length) return;
            lines.forEach((l) => allRows.push(['Cashier', ref, ref, date, client.cashAccount, String(lines.length), '', l.d, l.a, l.amt.toFixed(2)]));
        });
        if (!allRows.length) return null;
        const header = ['Customer Name', 'Reference', 'Receipt Number', 'Date', 'Cash Account', 'Number of Distributions', 'Invoice Paid', 'Description', 'G/L Account', 'Amount'];
        return { csv: toCsv([header, ...allRows]) };
    }
    // Exact-template VAT Purchase Detail workbook: matches the taxpayer's own

            ws[vatCellRef(r, 13)] = { t: 'n', f: `L${sheetRow}+M${sheetRow}`, s: numStyle };

        const totalsRow0 = firstDataRow0 + entries.length;

        for (let c = 0; c <= 10; c++) ws[vatCellRef(totalsRow0, c)] = { v: '', t: 's', s: blankStyle };

    function buildRulesTemplate(client) {
        const rows = [['Journal', 'Line', 'Description', 'Account']];
        RULE_SLOTS.payments.forEach(([key, label]) => rows.push(['Payments', label, client.paymentsRule[key].desc, client.paymentsRule[key].acct]));
        RULE_SLOTS.receipts.forEach(([key, label]) => rows.push(['Receipts', label, client.receiptsRule[key].desc, client.receiptsRule[key].acct]));
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{ wch: 12 }, { wch: 28 }, { wch: 22 }, { wch: 12 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'GL Rules');
        return wb;

    // Returns an ARRAY of matches (not just one) because a real chart of
    // accounts often uses ONE combined account for both "VAT recoverable"
    // (payments side) and "VAT payable" (receipts side) — e.g. "Vat
    // Payable/Rece". That single row needs to fill both rule slots, or one
    // of them stays blank and Peachtree rejects the exported CSV.
    function keywordMatches(label) {
        const s = (label || '').toLowerCase();
        const has = (...words) => words.every((w) => s.includes(w));
        const out = [];
        if (has('vat') && (has('rec') || has('recoverable'))) out.push(['payments', 'vatAmount']);
        if (has('vat') && has('pay')) out.push(['receipts', 'vatPay']);
        if (out.length) return out;
        if (has('withhold')) return [['receipts', 'vatWithholding']];
        if (has('non', 'vat') && has('sale')) return [['receipts', 'nonVatSales']];
        if (has('non', 'vat')) return [['payments', 'nonVat']];
        if (has('sale')) return [['receipts', 'sales']];
        if (has('purchase')) return [['payments', 'vatBefore']];
        return [];
    }
    function parseRulesFile(workbook) {
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        if (!rows.length) return { matched: [], unmatched: [] };
        // Peachtree's own "Account List" export has a business name, report
        // title, and date printed above the real header row — so find the
        // row that actually says "Account ID" / "Description" rather than
        // assuming it's the very first row.
        let headerRowIdx = rows.findIndex((r) => (r || []).some((c) => /account/i.test(String(c || ''))) && (r || []).some((c) => /desc/i.test(String(c || ''))));
        if (headerRowIdx < 0) headerRowIdx = 0;
        const headerRow = (rows[headerRowIdx] || []).map((h) => String(h || '').toLowerCase());
        const idx = (needle) => headerRow.findIndex((h) => h.includes(needle));
        const descIdx = idx('desc') >= 0 ? idx('desc') : 2;
        const lineIdx = idx('line') >= 0 ? idx('line') : idx('journal') >= 0 ? idx('journal') : descIdx;
        const acctIdx = idx('account') >= 0 ? idx('account') : idx('code') >= 0 ? idx('code') : idx('id') >= 0 ? idx('id') : 3;
        const matched = [];
        const unmatched = [];
        rows.slice(headerRowIdx + 1).forEach((row) => {
            if (!row || !row.length) return;
            const label = row[lineIdx];
            const desc = row[descIdx];
            const acct = row[acctIdx];
            if (!desc && !acct) return;
            const ms = keywordMatches(String(label || desc || ''));
            if (ms.length) ms.forEach((m) => matched.push({ group: m[0], key: m[1], desc: String(desc ?? ''), acct: String(acct ?? '') }));
            else unmatched.push({ label, desc, acct });
        });
        return { matched, unmatched };
    }

            description: entry.description || null, measurement: entry.measurement || null,

        };

    async function handleSignIn() {

        const password = document.getElementById('signin-password').value;
        if (!email || !password) return showAuthError('Please enter your email and password.');
        setAuthLoading(true);

        if (error) return showAuthError(error.message);

    async function handleSignUp() {
        clearAuthError();
        const fullName = document.getElementById('auth-full-name').value.trim();
        const phone = document.getElementById('auth-phone').value.trim();
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const passwordConfirm = document.getElementById('auth-password-confirm').value;
        if (!fullName) return showAuthError('Please enter your full name.');
        if (!phone) return showAuthError('Please enter your phone number.');
        if (!email || !password) return showAuthError('Please enter an email and password.');
        if (password.length < 6) return showAuthError('Password must be at least 6 characters.');
        if (password !== passwordConfirm) return showAuthError('Passwords do not match. Please re-type them.');
        setAuthLoading(true);
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        setAuthLoading(false);
        if (error) return showAuthError(error.message);
        // Saved here rather than as part of the signUp() call itself, since
        // the accountant_profiles row needs an authenticated session to
        // write (RLS checks auth.uid() = user_id) -- which doesn't exist
        // yet if email confirmation is required. Picked up by afterSignIn()
        // whenever a session first becomes available, same pattern MELEYA's
        // own signup uses for pending business details.
        try { sessionStorage.setItem('meleya_acct_pending_profile', JSON.stringify({ full_name: fullName, phone })); } catch (e) {}
        if (!data.session) return showAuthError('Account created! Check your email to confirm your address, then sign in below.');

    // Creates the accountant_profiles row from the name/phone collected at

    async function applyPendingAccountantProfile() {

        try { pending = JSON.parse(sessionStorage.getItem('meleya_acct_pending_profile') || 'null'); } catch (e) {}
        if (!pending) return;
        try { sessionStorage.removeItem('meleya_acct_pending_profile'); } catch (e) {}

    // ------------------------------------------------------------------------
    // Receipt reading: Google's Gemini API (free tier via Google AI Studio —
    // no billing account, ~1,000 requests/day free on Flash-Lite). Unlike
    // plain OCR, this is a real model that understands the receipt's layout
    // (ignores the buyer's TIN, knows "TAX1" means VAT, etc.) instead of
    // pattern-matching blindly. Anything it can't confidently find is left
    // blank and flagged for the accountant to fill in on the review screen.
    // ------------------------------------------------------------------------
    function loadImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Could not read image'));
            img.src = URL.createObjectURL(file);
        });
    }
    function canvasToJpegBlob(canvas, quality) {
        return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
    }
    // Shrink large phone photos before upload — faster, and keeps well within
    // Gemini's inline-image size limits.
    async function compressImageForAi(file) {
        const img = await loadImage(file);
        let maxDim = 2000, quality = 0.82;
        let blob = null;
        for (let attempt = 0; attempt < 5; attempt++) {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            blob = await canvasToJpegBlob(canvas, quality);
            if (blob.size <= 1500 * 1024) break;
            maxDim = Math.round(maxDim * 0.8);
            quality = Math.max(0.5, quality - 0.1);
        }
        URL.revokeObjectURL(img.src);
        return blob;
    }
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result.split(',')[1]);
            r.onerror = () => reject(new Error('Could not read image'));
            r.readAsDataURL(blob);
        });
    }
    const RECEIPT_PROMPT = `You are reading a photo of an Ethiopian cash sales receipt printed by a fiscal cash register (ERCA-compliant). These receipts follow a consistent layout:
- The SELLER'S TIN is printed near the very top as "TIN: XXXXXXXXXX", immediately followed by the seller's business/owner name, then address/phone lines.
- A separate "Buyer's TIN" (sometimes "Buyer's T I N") line appears further down — that is the BUYER'S own TIN, not the seller's. Ignore it entirely; never use it for seller_tin.
- The receipt number is printed as "FS No. XXXXXXXX".
- The date is printed as DD/MM/YYYY, always in the GREGORIAN calendar, day first — this receipt format never uses the Ethiopian calendar.
- Line items appear either as one line per item ("DESCRIPTION   QTY   PRICE   AMOUNT") or as two lines per item ("QTY x PRICE =" then "DESCRIPTION   *AMOUNT" on the next line).
- The taxable subtotal is labeled "TXBL1". The VAT amount is labeled "TAX1" or "TAX 1" (usually shown with "15.00%" or "15%") — this receipt format never prints the word "VAT" for this line. The grand total is labeled "TOTAL".
- A machine registration code is printed near the bottom as "ET" followed by a code like "FGB0005691" or "BEB0004862" — this is the MRC (machine registration certificate number). It is never labeled "MRC" directly.
- A separate VAT registration number is usually NOT printed on these receipts — only fill vat_reg_no if you actually see a distinct label like "VAT REG NO"; do not reuse the TIN for it.

Extract exactly these fields and return ONLY raw JSON, no markdown fences, no commentary:
{
  "seller_name": string or null,
  "seller_tin": string or null,
  "vat_reg_no": string or null,
  "mrc": string or null,
  "date_year": number or null,
  "date_month": number or null,
  "date_day": number or null,
  "receipt_no": string or null,
  "is_vat": boolean,
  "before_vat": number or null,
  "vat": number or null,
  "total": number or null,
  "description": string or null,
  "measurement": string or null,
  "quantity": number or null,
  "unit_price": number or null,
  "missing_fields": string[]
}

If there are multiple line items, pick only the SINGLE item with the largest amount and use its description, quantity, and unit_price — do not combine or list multiple items together in "description". Set "measurement" to "Lot", "quantity" to 1, and "unit_price" equal to "before_vat" ONLY if you cannot identify a clear largest item; otherwise use that one item's own measurement/quantity/unit_price as printed (measurement only if a unit like PCS/KG/M is actually printed next to it — this receipt format usually does not print one, so leave it null rather than guess). If there is exactly ONE line item, fill "description", "quantity", "unit_price", and "measurement" from that single item the same way. "before_vat", "vat", and "total" should always be the receipt-wide totals from the TXBL1/TAX1/TOTAL lines, never a per-item figure. A separate VAT registration number is normal to be absent on this receipt format — never include "VAT reg no" in "missing_fields". In "missing_fields", only list fields from this set that you could not confidently read: "Seller name", "Seller TIN", "MRC".`;

    async function runGeminiExtraction(file, onStatus) {
        if (!GEMINI_API_KEY || GEMINI_API_KEY.startsWith('REPLACE_WITH')) {
            throw new Error('No Gemini API key set yet — add a free key from aistudio.google.com/apikey near the top of this file.');
        }
        onStatus && onStatus('Preparing photo…');
        const blob = await compressImageForAi(file);
        const base64 = await blobToBase64(blob);
        onStatus && onStatus('Reading the receipt…');
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY },
            body: JSON.stringify({
                contents: [{ parts: [
                    { inline_data: { mime_type: 'image/jpeg', data: base64 } },
                    { text: RECEIPT_PROMPT },
                ] }],
                generationConfig: { responseMimeType: 'application/json' },
            }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new Error((data && data.error && data.error.message) || `Gemini request failed (${res.status})`);
        const text = ((data.candidates || [])[0]?.content?.parts || []).map((p) => p.text || '').join('');
        if (!text.trim()) throw new Error('No result returned from Gemini');
        const parsed = JSON.parse(text);
        parsed.date_calendar = 'GC';
        return parsed;
    }

        if (!client) return;
        Object.assign(client, patch);
        const { error } = await supabaseClient.from('accountant_clients').update(clientPatchToDb(patch)).eq('id', id);
        if (error) alert(error.message);
    }

        activeClientId = id;
        activeTab = 'receipts';
        receiptsFilter = { mode: 'all', month: null, year: currentEcYear() };

        render();
        await loadEntriesForActiveClient();
        render();

    async function addEntry(entry) {
        const client = activeClient();
        const { data, error } = await supabaseClient.from('accountant_entries').insert(entryToDb(entry, client.id)).select().single();
        if (error) { alert(error.message); return; }
        client.entries.unshift(mapEntryFromDb(data));
        client.entryCount = (client.entryCount || 0) + 1;
        processNextQueuedFile(); // moves to the next photo in the batch, or closes the flow if none left
    }
    async function removeEntry(id) {
        const client = activeClient();
        const { error } = await supabaseClient.from('accountant_entries').delete().eq('id', id);
        if (error) { alert(error.message); return; }
        client.entries = client.entries.filter((e) => e.id !== id);
        client.entryCount = Math.max(0, (client.entryCount || 1) - 1);
        render();
    }

    // ------------------------------------------------------------------------
    // Render dispatch
    // ------------------------------------------------------------------------
    function render() {
        // Re-rendering rebuilds the whole page's HTML, which would normally
        // steal focus out of whatever input the person is typing in (e.g. a
        // search box that re-renders on every keystroke). Remember which
        // field was focused, and where the cursor was, then restore both
        // afterward.
        const active = document.activeElement;
        const activeId = active && active.id ? active.id : null;
        const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
        const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

        const root = document.getElementById('view-root');
        let html = addClientSearchOpen ? renderAddClientSearch() : (linksInboxOpen ? renderLinksInbox() : (activeClientId ? renderClientDetail() : renderDashboard()));
        if (profileModalOpen) html += renderProfileModal();
        if (linkSearchOpen) html += renderLinkSearchModal();
        root.innerHTML = html;
        refreshIcons();

        if (activeId) {
            const el = document.getElementById(activeId);
            if (el) {
                el.focus();
                if (selStart !== null && el.setSelectionRange) {
                    try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text-selectable input, ignore */ }
                }
            }
        }
    }

    // ------------------------------------------------------------------------
    // EC period filter (shared by Receipts + Export tabs): All / By Month / By Year
    // ------------------------------------------------------------------------
    function filterRange(state, entries) {
        if (state.mode === 'all') {
            const periods = ecPeriodsFor(entries);
            if (!periods.length) { const y = currentEcYear(); return [`${y}-01`, `${y}-13`]; }
            return [periods[0], periods[periods.length - 1]];
        }
        // Ethiopian fiscal year is named after its END year: fiscal year 2018
        // runs Hamle 2017 (month 11) through Sene 2018 (month 10).
        if (state.mode === 'year') return [`${state.year - 1}-11`, `${state.year}-10`];
        return [`${state.year}-${String(state.month).padStart(2, '0')}`, `${state.year}-${String(state.month).padStart(2, '0')}`];
    }
    function renderEcFilter(prefix, entries, state) {
        const years = ecYearsFor(entries || []);
        // Only 12 selectable months — Pagume is merged into Nehase, so it's
        // never its own filter option.
        const monthOptions = Array.from({ length: 12 }, (_, i) => i + 1)
            .map((m) => `<option value="${m}" ${state.month === m ? 'selected' : ''}>${periodMonthLabel(m)}</option>`).join('');
        const yearOptions = years.map((y) => `<option value="${y}" ${state.year === y ? 'selected' : ''}>${y}</option>`).join('');
        return `
            <div class="filter-bar">
                <select onchange="${prefix}SetMode(this.value)">
                    <option value="all" ${state.mode === 'all' ? 'selected' : ''}>All periods</option>
                    <option value="month" ${state.mode === 'month' ? 'selected' : ''}>By Month</option>
                    <option value="year" ${state.mode === 'year' ? 'selected' : ''}>By Year</option>
                </select>
                ${state.mode === 'month' ? `<select onchange="${prefix}SetMonth(this.value)"><option value="" disabled ${!state.month ? 'selected' : ''}>Month</option>${monthOptions}</select>` : ''}
                ${state.mode !== 'all' ? `<select onchange="${prefix}SetYear(this.value)">${yearOptions}</select>` : ''}
            </div>`;
    }
    function rfSetMode(v) { receiptsFilter.mode = v; if (v === 'month' && !receiptsFilter.month) receiptsFilter.month = 1; render(); }
    function rfSetMonth(v) { receiptsFilter.month = Number(v); receiptsFilter.mode = 'month'; render(); }
    function rfSetYear(v) { receiptsFilter.year = Number(v); render(); }
    function efSetMode(v) { exportFilter.mode = v; if (v === 'month' && !exportFilter.month) exportFilter.month = 1; render(); }
    function efSetMonth(v) { exportFilter.month = Number(v); exportFilter.mode = 'month'; render(); }
    function efSetYear(v) { exportFilter.year = Number(v); render(); }

                    <tbody>${rows}</tbody></table></div>`}

    // ------------------------------------------------------------------------
    // Add receipt flow (upload -> extracting -> review/save)
    // ------------------------------------------------------------------------
    function startAddReceipt() {
        addFlow = { step: 'upload', preview: null, error: null, form: null, statusText: '', queue: [], queueTotal: 0, queueIndex: 0 };
        render();
    }
    function cancelAddReceipt() { addFlow = null; render(); }

    // Accepts one or many files (multi-select, or repeated camera captures).
    // The first is processed immediately; the rest wait in addFlow.queue and
    // are reviewed one at a time after each save/skip.
    async function handleReceiptFile(input) {
        const files = Array.from(input.files || []);
        input.value = ''; // lets the same file(s) be picked again later
        if (!files.length) return;
        addFlow.queue = files.slice(1);
        addFlow.queueTotal = files.length;
        addFlow.queueIndex = 1;
        await processReceiptFile(files[0]);
    }
    function processNextQueuedFile() {
        if (addFlow && addFlow.queue && addFlow.queue.length) {
            addFlow.queueIndex += 1;
            const next = addFlow.queue.shift();
            processReceiptFile(next);
        } else {
            addFlow = null;
            render();
        }
    }
    function skipQueuedFile() { processNextQueuedFile(); }

    async function processReceiptFile(file) {
        addFlow.error = null;
        addFlow.preview = URL.createObjectURL(file);
        addFlow.step = 'extracting';
        addFlow.statusText = 'Preparing photo…';
        render();
        try {
            const ex = await runGeminiExtraction(file, (status) => {
                addFlow.statusText = status;
                const el = document.getElementById('ocr-progress-text');
                if (el) el.textContent = status;
            });
            const calendar = ex.date_calendar === 'EC' ? 'EC' : 'GC';
            let gcDate = '';
            if (ex.date_year && ex.date_month && ex.date_day) {
                gcDate = calendar === 'EC' ? ecToGc(ex.date_year, ex.date_month, ex.date_day) : `${ex.date_year}-${String(ex.date_month).padStart(2, '0')}-${String(ex.date_day).padStart(2, '0')}`;
            }
            addFlow.form = {
                type: 'payment', calendar, ecYear: ex.date_year || '', ecMonth: ex.date_month || '', ecDay: ex.date_day || '', date: gcDate,
                sellerName: ex.seller_name || '', sellerTin: ex.seller_tin || '', vatRegNo: ex.vat_reg_no || '', mrc: ex.mrc || '',
                receiptNo: ex.receipt_no || '', isVat: !!ex.is_vat, beforeVat: ex.before_vat ?? '', vat: ex.vat ?? '', total: ex.total ?? '',
                description: ex.description || '', measurement: ex.measurement || '', quantity: ex.quantity ?? '', unitPrice: ex.unit_price ?? '',
                missing: ex.missing_fields || [],
            };
            addFlow.step = 'review';
        } catch (e) {
            console.error(e);
            addFlow.error = 'Could not read this receipt automatically. Fill the fields in by hand below.';
            addFlow.form = { type: 'payment', calendar: 'GC', ecYear: '', ecMonth: '', ecDay: '', date: '', sellerName: '', sellerTin: '', vatRegNo: '', mrc: '', receiptNo: '', isVat: true, beforeVat: '', vat: '', total: '', description: '', measurement: '', quantity: '', unitPrice: '', missing: [] };
            addFlow.step = 'review';
        }
        render();
    }

    function renderAddReceiptFlow() {
        if (addFlow.step === 'upload') {
            return `
                <div class="card" style="text-align:center;">
                    ${icon('upload', 26)}
                    <div style="margin:10px 0 14px; color:var(--text-soft); font-size:13.5px;">Upload photos of the receipt or invoice, or take one with your camera</div>
                    <input type="file" accept="image/*" multiple style="display:none;" id="receipt-file-input" onchange="handleReceiptFile(this)">
                    <input type="file" accept="image/*" capture="environment" style="display:none;" id="receipt-camera-input" onchange="handleReceiptFile(this)">
                    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="document.getElementById('receipt-file-input').click()">${icon('upload', 15)} Choose photos</button>
                        <button class="btn btn-ghost" onclick="document.getElementById('receipt-camera-input').click()">${icon('camera', 15)} Take photo</button>
                        <button class="btn btn-ghost" onclick="cancelAddReceipt()">Cancel</button>
                    </div>
                    <div style="margin-top:10px; font-size:11.5px; color:var(--text-soft);">You can select several receipt photos at once — they're reviewed and saved one at a time.</div>
                </div>`;
        }
        const progress = addFlow.queueTotal > 1 ? `<div style="font-size:11.5px; color:var(--text-soft); margin-bottom:8px;">Photo ${addFlow.queueIndex} of ${addFlow.queueTotal}</div>` : '';
        if (addFlow.step === 'extracting') {
            return `
                <div class="card">
                    ${progress}
                    <div style="display:flex; gap:16px; align-items:center;">
                        ${addFlow.preview ? `<img src="${addFlow.preview}" style="width:90px; height:90px; object-fit:cover; border-radius:4px; border:1px solid var(--paper-line);">` : ''}
                        <div style="display:flex; align-items:center; gap:8px; color:var(--text-soft); font-size:13.5px;"><span class="spin" style="display:inline-flex;">${icon('loader-2', 16)}</span> <span id="ocr-progress-text">${esc(addFlow.statusText || 'Reading the receipt…')}</span></div>
                    </div>
                </div>`;
        }
        const f = addFlow.form;
        const missingSet = new Set(f.missing || []);
        const field = (key, label, flagName, mono) => `
            <div><label>${label}</label>
            <input type="text" id="f-${key}" value="${esc(f[key])}" class="${missingSet.has(flagName || label) ? 'flagged' : ''}" style="${mono ? "font-family:'IBM Plex Mono',monospace;" : ''}" oninput="addFlow.form.${key}=this.value"></div>`;
        const dateStatus = f.date ? `→ ${f.date} (GC)` : 'date incomplete';
        return `
            <div class="card">
                ${progress}
                <div style="display:flex; gap:18px;">
                    ${addFlow.preview ? `<img src="${addFlow.preview}" style="width:130px; border-radius:4px; border:1px solid var(--paper-line); align-self:flex-start;">` : ''}
                    <div style="flex:1;">
                        ${addFlow.error ? `<div class="notice notice-warn">${icon('alert-triangle', 14)} ${esc(addFlow.error)}</div>` : ''}
                        <div style="display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;">
                            <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;"><input type="radio" name="entry-type" style="width:auto;" ${f.type === 'payment' ? 'checked' : ''} onchange="addFlow.form.type='payment'"> Purchase (payment out)</label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer;"><input type="radio" name="entry-type" style="width:auto;" ${f.type === 'receipt' ? 'checked' : ''} onchange="addFlow.form.type='receipt'"> Sale (receipt in)</label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; margin-left:auto;"><input type="checkbox" style="width:auto;" ${f.isVat ? 'checked' : ''} onchange="addFlow.form.isVat=this.checked"> VAT receipt</label>
                        </div>
                        <div class="grid-3" style="margin-bottom:12px;">
                            ${field('sellerName', 'Seller name')}
                            ${field('sellerTin', 'Seller TIN', 'Seller TIN')}
                            ${field('vatRegNo', 'VAT reg no', 'VAT reg no')}
                            ${field('mrc', 'MRC code', 'MRC')}
                            ${field('receiptNo', 'Receipt / FS number')}
                            <div></div>
                        </div>
                        <div style="border:1px solid var(--paper-line); border-radius:5px; padding:12px; margin-bottom:12px; background:var(--paper);">
                            <div style="display:flex; gap:16px; margin-bottom:10px;">
                                <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;"><input type="radio" name="cal" style="width:auto;" ${f.calendar === 'EC' ? 'checked' : ''} onchange="setDateCalendar('EC')"> Ethiopian calendar date</label>
                                <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;"><input type="radio" name="cal" style="width:auto;" ${f.calendar === 'GC' ? 'checked' : ''} onchange="setDateCalendar('GC')"> Gregorian calendar date</label>
                            </div>
                            <div style="display:grid; grid-template-columns:repeat(3,90px) 1fr; gap:10px; align-items:end;">
                                <div><label>Year</label><input id="f-ecYear" class="mono" value="${esc(f.ecYear)}" oninput="setDatePart('ecYear',this.value)"></div>
                                <div><label>Month</label><input id="f-ecMonth" class="mono" value="${esc(f.ecMonth)}" oninput="setDatePart('ecMonth',this.value)"></div>
                                <div><label>Day</label><input id="f-ecDay" class="mono" value="${esc(f.ecDay)}" oninput="setDatePart('ecDay',this.value)"></div>
                                <div style="font-size:12px; color:var(--text-soft);">
                                    ${f.calendar === 'EC' && f.ecMonth ? `${EC_MONTHS[Number(f.ecMonth) - 1] || '?'} ${f.ecYear}` : ''}
                                    <div id="date-preview" class="mono" style="font-weight:600; color:${f.date ? 'var(--text)' : 'var(--amber)'};">${dateStatus}</div>
                                </div>
                            </div>
                        </div>
                        <div class="grid-3" style="margin-bottom:12px;">
                            ${field('beforeVat', 'Before VAT', null, true)}
                            ${field('vat', 'VAT', null, true)}
                            ${field('total', 'Total', null, true)}
                        </div>
                        <div class="grid-4" style="margin-bottom:16px;">
                            ${field('description', 'Description')}
                            ${field('measurement', 'Measurement', 'Measurement')}
                            ${field('quantity', 'Quantity', 'Quantity', true)}
                            ${field('unitPrice', 'Unit price', 'Unit price', true)}
                        </div>
                        <div style="display:flex; gap:10px;">
                            <button class="btn btn-primary" id="save-receipt-btn" ${f.date ? '' : 'disabled'} onclick="saveReceiptForm()">${icon('check', 15)} Save receipt</button>
                            ${addFlow.queue.length ? `<button class="btn btn-ghost" onclick="skipQueuedFile()">${icon('skip-forward', 15)} Skip this one</button>` : ''}
                            <button class="btn btn-ghost" onclick="cancelAddReceipt()">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>`;
    }
    function setDateCalendar(cal) { addFlow.form.calendar = cal; recomputeDatePreview(); }
    function setDatePart(part, v) { addFlow.form[part] = v; recomputeDatePreview(); }
    function recomputeDatePreview() {
        const f = addFlow.form;
        const y = Number(f.ecYear), m = Number(f.ecMonth), d = Number(f.ecDay);
        f.date = (!y || !m || !d) ? '' : (f.calendar === 'EC' ? ecToGc(y, m, d) : `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
        const preview = document.getElementById('date-preview');
        const btn = document.getElementById('save-receipt-btn');
        if (preview) { preview.textContent = f.date ? `→ ${f.date} (GC)` : 'date incomplete'; preview.style.color = f.date ? 'var(--text)' : 'var(--amber)'; }
        if (btn) btn.disabled = !f.date;
    }
    function saveReceiptForm() {
        const f = addFlow.form;
        addEntry({
            ...f,
            beforeVat: Number(f.beforeVat) || 0, vat: Number(f.vat) || 0, total: Number(f.total) || 0,
            quantity: f.quantity === '' ? null : Number(f.quantity), unitPrice: f.unitPrice === '' ? null : Number(f.unitPrice),
        });
    }

    // ------------------------------------------------------------------------
    // GL rules tab
    // ------------------------------------------------------------------------
    let rulesDraft = null;
    function renderRulesTab(client) {
        if (!rulesDraft || rulesDraft.id !== client.id) {
            rulesDraft = JSON.parse(JSON.stringify({ id: client.id, paymentsRule: client.paymentsRule, receiptsRule: client.receiptsRule }));
        }
        const d = rulesDraft;
        const ruleRow = (group, key, label) => `
            <div class="rule-row">
                <div class="label">${label} →</div>
                <input value="${esc(d[group][key].desc)}" oninput="rulesDraft.${group}.${key}.desc=this.value" placeholder="Description">
                <input class="mono" value="${esc(d[group][key].acct)}" oninput="rulesDraft.${group}.${key}.acct=this.value" placeholder="G/L account">
            </div>`;
        return `
            <div class="wrap-narrow" style="margin:0;">
                <div class="section">
                    <div class="section-title">Set the account split</div>
                    <div style="display:flex; gap:10px; margin-bottom:16px;">
                        <input type="file" accept=".xlsx,.xls,.csv" style="display:none;" id="rules-file-input" onchange="handleRulesUpload(this)">
                        <button class="btn btn-ghost" onclick="document.getElementById('rules-file-input').click()">${icon('file-up', 14)} Upload rules file / chart of accounts</button>
                        <button class="btn btn-ghost" onclick="downloadRulesTemplate()">${icon('download', 14)} Download template</button>
                    </div>
                    <div style="font-size:11.5px; color:var(--text-soft); margin:-6px 0 10px;">You can upload the client's own GL rules template, or export Peachtree's Account List and upload that directly — the app will match accounts by name.</div>
                    <div id="rules-upload-msg"></div>
                </div>
                <div class="section">
                    <div class="section-title">Payments split (purchases)</div>
                    ${RULE_SLOTS.payments.map(([key, label]) => ruleRow('paymentsRule', key, label)).join('')}
                </div>
                <div class="section">
                    <div class="section-title">Receipts split (sales)</div>
                    ${RULE_SLOTS.receipts.map(([key, label]) => ruleRow('receiptsRule', key, label)).join('')}
                </div>
                <button class="btn btn-primary" onclick="saveRules()">${icon('check', 15)} Save rules</button>
            </div>`;
    }
    async function saveRules() {
        await patchClient(rulesDraft.id, { paymentsRule: rulesDraft.paymentsRule, receiptsRule: rulesDraft.receiptsRule });
        render();
    }
    function downloadRulesTemplate() {
        const wb = buildRulesTemplate(rulesDraft);
        const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const client = activeClient();
        downloadBlob(new Blob([out], { type: 'application/octet-stream' }), `${(client ? client.name : 'client').replace(/\s+/g, '_')}_gl_rules_template.xlsx`, 'application/octet-stream');
    }
    async function handleRulesUpload(input) {
        const file = input.files[0];
        if (!file) return;
        const msgBox = document.getElementById('rules-upload-msg');
        msgBox.innerHTML = '';
        try {
            const buf = await file.arrayBuffer();
            const wb = XLSX.read(buf, { type: 'array' });
            const { matched, unmatched } = parseRulesFile(wb);
            if (!matched.length) {
                msgBox.innerHTML = `<div class="notice notice-warn">${icon('alert-triangle', 14)} Couldn't match any rows to a known line (Non-VAT purchases, VAT purchases, VAT recoverable, Sales, etc). Try the template instead.</div>`;
                refreshIcons();
                return;
            }
            matched.forEach((m) => { rulesDraft[`${m.group}Rule`][m.key] = { desc: m.desc, acct: m.acct }; });
            msgBox.innerHTML = `<div class="notice notice-ok">${icon('check', 14)} Filled ${matched.length} GL rule line${matched.length === 1 ? '' : 's'} from that file${unmatched.length ? ` (${unmatched.length} other account${unmatched.length === 1 ? '' : 's'} in the file weren't relevant, so they were skipped — that's normal for a full chart of accounts).` : '.'} Review below, then Save.</div>`;
            render();
        } catch (e) {
            console.error(e);
            msgBox.innerHTML = `<div class="notice notice-warn">${icon('alert-triangle', 14)} Could not read that file. Make sure it's the .xlsx/.csv template format.</div>`;
            refreshIcons();
        }
    }

    // ------------------------------------------------------------------------
    // Export tab
    // ------------------------------------------------------------------------
    function renderExportTab(client) {
        if (exportFilter.mode == null) {
            const periods = ecPeriodsFor(client.entries);
            const def = periods.length ? periods[periods.length - 1].split('-') : [String(currentEcYear()), '01'];
            exportFilter = { mode: 'month', year: Number(def[0]), month: Number(def[1]) };
        }
        const [fromKey, toKey] = filterRange(exportFilter, client.entries);
        const periodLabel = fromKey === toKey ? ecPeriodLabel(fromKey) : `${ecPeriodLabel(fromKey)} – ${ecPeriodLabel(toKey)}`;
        const rangeEntries = client.entries.filter((e) => { const k = entryEcKey(e); return k >= fromKey && k <= toKey; });
        const flaggedCount = rangeEntries.filter((e) => e.missing && e.missing.length > 0).length;
        return `
            <div class="wrap-narrow" style="margin:0;">
                <div style="font-size:12.5px; color:var(--text-soft); margin-bottom:14px;">
                    Master log: ${client.entries.length} receipt${client.entries.length === 1 ? '' : 's'} total. Exports below pull from this whole log, filtered to the period you pick.
                </div>
                <div style="margin-bottom:16px;">${renderEcFilter('ef', client.entries, exportFilter)}</div>
                <div style="font-size:12.5px; color:var(--text-soft); margin-bottom:14px;">
                    ${rangeEntries.length} receipt${rangeEntries.length === 1 ? '' : 's'} in ${periodLabel}
                    ${flaggedCount > 0 ? `<span style="color:var(--amber); margin-left:8px;">· ${flaggedCount} need${flaggedCount === 1 ? 's' : ''} review before filing</span>` : ''}
                </div>
                <div class="export-row">
                    <div class="icon-box">${icon('wallet', 16)}</div>
                    <div class="info"><div class="title">Payments Journal CSV</div><div class="desc">Purchase totals for this period, split by your GL rule.</div></div>
                    <button class="btn btn-ghost" onclick="downloadPayments()">${icon('download', 14)} Download</button>
                </div>
                <div class="export-row">
                    <div class="icon-box">${icon('receipt', 16)}</div>
                    <div class="info"><div class="title">Cash Receipts Journal CSV</div><div class="desc">Sale totals for this period, same import flow, Accounts Receivable side.</div></div>
                    <button class="btn btn-ghost" onclick="downloadReceipts()">${icon('download', 14)} Download</button>
                </div>
                <div class="export-row">
                    <div class="icon-box">${icon('file-text', 16)}</div>
                    <div class="info"><div class="title">VAT Purchase Detail (.xlsx)</div><div class="desc">Filled tax-authority form, one row per purchase receipt in this period.</div></div>
                    <button class="btn btn-ghost" onclick="downloadVat()">${icon('download', 14)} Download</button>
                </div>
            </div>`;
    }
    function exportRangeAndLabel(client) {
        const [fromKey, toKey] = filterRange(exportFilter, client.entries);
        const label = fromKey === toKey ? fromKey : `${fromKey}_to_${toKey}`;
        return { fromKey, toKey, label };
    }
    async function downloadPayments() {
        const client = activeClient();
        if (client.pvCounter == null) {
            const input = prompt('First Payments Journal export for this client — what Check Number should numbering start from? (e.g. 1)');
            if (input === null) return; // user cancelled
            const start = parseInt(input, 10);
            if (!Number.isFinite(start) || start < 0) { alert('Please enter a whole number, e.g. 1.'); return; }
            client.pvCounter = start;
        }
        const { fromKey, toKey, label } = exportRangeAndLabel(client);
        const result = buildPaymentsCsv(client, fromKey, toKey);
        if (!result) { alert('No purchase receipts logged for this period.'); return; }
        downloadBlob(result.csv, `${client.name.replace(/\s+/g, '_')}_payments_${label}.csv`, 'text/csv');
        await patchClient(client.id, { pvCounter: result.nextCounter });
    }
    function downloadReceipts() {
        const client = activeClient();
        const { fromKey, toKey, label } = exportRangeAndLabel(client);
        const result = buildReceiptsCsv(client, fromKey, toKey);
        if (!result) { alert('No sale receipts logged for this period.'); return; }
        downloadBlob(result.csv, `${client.name.replace(/\s+/g, '_')}_receipts_${label}.csv`, 'text/csv');
    }
    function downloadVat() {
        const client = activeClient();
        const { fromKey, toKey, label } = exportRangeAndLabel(client);
        const { wb, count } = buildVatWorkbook(client, fromKey, toKey);
        if (!count) { alert('No purchase receipts logged for this period.'); return; }
        const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        downloadBlob(new Blob([out], { type: 'application/octet-stream' }), `${client.name.replace(/\s+/g, '_')}_vat_purchase_detail_${label}.xlsx`, 'application/octet-stream');
    }
</script>
</body>
</html>
